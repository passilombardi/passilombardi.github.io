<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><meta name="description" content="Passi Lombardi: la guida a voce per camminare, correre e pedalare in Lombardia."><link rel="manifest" href="manifest.json"><link rel="icon" href="icona-192.png"><link rel="apple-touch-icon" href="icona-180.png"><style>*{box-sizing:border-box}html,body{margin:0}</style></head><body>
<title>Passi Lombardi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: mappa topografica sempre visibile; sotto (telefono) o a destra (computer) le schermate dell'app: Home → Percorso → In cammino */
:root{--carta:#eef0e6;--terra:#d9dccb;--inchiostro:#1d2a24;--tenue:#5d6b63;--lago:#7fb3c9;--percorso:#c2410c;--tu:#0f766e;--pannello:#fbfcf7;--linea:#c9cdbd;--accento:#0f766e;--su-accento:#ffffff;--scheda:#f3f5ec;
 --f-titolo:'Bricolage Grotesque',system-ui,sans-serif;--f-testo:'Atkinson Hyperlegible',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--carta:#151d19;--terra:#1e2823;--inchiostro:#e7eee9;--tenue:#9aaba1;--lago:#2f5f73;--percorso:#fb923c;--tu:#2dd4bf;--pannello:#1a231f;--linea:#2e3b34;--accento:#2dd4bf;--su-accento:#062520;--scheda:#212c27;color-scheme:dark}}
:root[data-theme="dark"]{--carta:#151d19;--terra:#1e2823;--inchiostro:#e7eee9;--tenue:#9aaba1;--lago:#2f5f73;--percorso:#fb923c;--tu:#2dd4bf;--pannello:#1a231f;--linea:#2e3b34;--accento:#2dd4bf;--su-accento:#062520;--scheda:#212c27;color-scheme:dark}
html,body{height:100%}
body{background:var(--carta);color:var(--inchiostro);font:16px/1.45 var(--f-testo);overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:38% 62%}
#app.cammino{grid-template-rows:55% 45%}
@media (min-width:900px){#app,#app.cammino{grid-template-columns:1fr 420px;grid-template-rows:1fr}}
#mappa{position:relative;min-height:0;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%}
.marchio{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));background:var(--pannello);border:1px solid var(--linea);border-radius:12px;padding:5px 12px;font:800 17px var(--f-titolo)}
.marchio small{display:block;font:400 10.5px var(--f-testo);color:var(--tenue);letter-spacing:.06em;text-transform:uppercase}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:50%;border:1px solid var(--linea);background:var(--pannello);color:var(--inchiostro);font:700 19px var(--f-testo);cursor:pointer}
.scala{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;font-size:12px;color:var(--tenue);background:var(--pannello);border-radius:8px;padding:2px 8px}
#pan{background:var(--pannello);border-top:1px solid var(--linea);overflow:auto;min-height:0;min-width:0}
@media (min-width:900px){#pan{border-top:0;border-left:1px solid var(--linea)}}
.sch{padding-block:14px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sch>*{flex-shrink:0}
h1{font:800 26px/1.1 var(--f-titolo);margin:0;letter-spacing:-.015em;text-wrap:balance}
h2{font:800 13px var(--f-titolo);margin:4px 0 0;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue)}
.sotto{color:var(--tenue);margin:0;font-size:15px}
.indietro{align-self:flex-start;border:0;background:none;color:var(--accento);font:700 15px var(--f-testo);cursor:pointer;padding:0}
.lista{display:flex;flex-direction:column;gap:8px}
.card{box-sizing:border-box;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--linea);background:var(--scheda);color:var(--inchiostro);border-radius:14px;padding:10px 12px;cursor:pointer;font:inherit;width:100%}
.card .ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--pannello)}
.card b{display:block;font:800 16px/1.2 var(--f-titolo)}
.card small{color:var(--tenue);font-size:13px}
.card .fr{color:var(--accento);font-weight:700;font-size:20px}
.card.grande{border-color:var(--accento);box-shadow:inset 0 0 0 1px var(--accento)}
.cerca{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:12px;border:1px solid var(--linea);background:var(--carta);color:var(--inchiostro);font:inherit}
.dati{display:flex;gap:8px;flex-wrap:wrap}
.dati span{background:var(--scheda);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.tappe{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tappe li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--linea)}
.tappe .n{width:26px;height:26px;border-radius:50%;background:var(--percorso);color:#fff;display:grid;place-items:center;font:800 13px var(--f-titolo)}
.tappe li.fatta .n{background:var(--tenue)}
.tappe b{font-weight:700}
.tappe small{display:block;color:var(--tenue);font-size:13px}
.play{width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--pannello);color:var(--accento);cursor:pointer;font-size:15px}
.btn{border:0;border-radius:999px;padding:13px 20px;font:700 16px var(--f-testo);cursor:pointer;background:var(--terra);color:var(--inchiostro)}
.btn.primo{background:var(--accento);color:var(--su-accento)}
.btn.lungo{width:100%}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--percorso);outline-offset:2px}
.riga{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--tenue)}
select{background:var(--carta);color:var(--inchiostro);border:1px solid var(--linea);border-radius:10px;padding:9px;font:inherit;width:100%}
label.campo{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px}
.player{background:var(--scheda);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.player .top{display:flex;gap:12px;align-items:center}
.player .gplay{width:54px;height:54px;border-radius:50%;border:0;background:var(--accento);color:var(--su-accento);font-size:22px;cursor:pointer;flex:0 0 auto}
.player .tit{min-width:0}
.player .tit small{color:var(--percorso);font-weight:700;font-size:13px}
.player .tit b{display:block;font:800 19px/1.2 var(--f-titolo)}
.barra{height:6px;border-radius:3px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--accento);transition:width .2s}
.player p{margin:0;font-size:15.5px}
.prossima{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px dashed var(--linea);border-radius:12px;padding:8px 12px;font-size:14px}
.prossima b{font-size:16px}
.stato{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-variant-numeric:tabular-nums}
.stato div{background:var(--scheda);border-radius:10px;padding:6px 10px}
.stato small{display:block;color:var(--tenue);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.stato b{font:800 18px var(--f-titolo)}
.nota{font-size:12.5px;color:var(--tenue);margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--linea);background:var(--scheda);color:var(--inchiostro);border-radius:999px;padding:6px 12px;font:700 13px var(--f-testo);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accento);color:var(--su-accento);border-color:var(--accento)}
#pan{display:flex;flex-direction:column}
#scroll{flex:1;overflow:auto;min-height:0}
nav.tab{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--linea);background:var(--pannello);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tab button{border:0;background:none;color:var(--tenue);font:700 12px var(--f-testo);padding:8px 2px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tab button span{font-size:20px;line-height:1}
nav.tab button[aria-current="page"]{color:var(--accento)}
#app.cammino nav.tab{display:none}
.liv{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.liv.verde{background:#16a34a}.liv.blu{background:#2563eb}.liv.rosso{background:#dc2626}
.card .ico{position:relative}
.card .ico .liv{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border:2px solid var(--scheda);margin:0}
.interr{display:flex;flex-direction:column;gap:6px}
.interr label{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--scheda);border-radius:12px;padding:10px 12px;font-weight:700;cursor:pointer}
.interr input{width:22px;height:22px;accent-color:var(--accento)}
.stato{grid-template-columns:repeat(2,1fr)}
@media (min-width:420px){.stato{grid-template-columns:repeat(4,1fr)}}
.eser{background:var(--scheda);border:2px solid var(--percorso);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center}
.eser .big{font-size:40px}
.via-in{display:flex;flex-direction:column;gap:6px;background:var(--scheda);border-radius:12px;padding:10px}
.via-in input{padding:9px;border-radius:10px;border:1px solid var(--linea);background:var(--carta);color:var(--inchiostro);font:inherit}
.via-in .ok{color:var(--accento);font-weight:700;font-size:14px}
.via-in .btn{padding:9px 14px;font-size:14px}
.btn.attesa{background:var(--percorso);color:#fff}
.legenda{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--tenue)}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.res div{background:var(--scheda);border-radius:12px;padding:10px;text-align:center}
.res b{display:block;font:800 22px var(--f-titolo)}
.res small{color:var(--tenue);font-size:12px}
.ciao h1{font-size:28px}
.passi3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;counter-reset:p}
.passi3 div{background:var(--scheda);border-radius:14px;padding:10px 8px;text-align:center;font-size:13px;line-height:1.25}
.passi3 div b{display:block;font-size:24px;margin-bottom:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--linea);background:var(--scheda);color:var(--inchiostro);border-radius:16px;padding:14px 12px;text-align:left;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:4px;min-height:104px}
.tile .e{font-size:30px;line-height:1}
.tile b{font:800 17px/1.15 var(--f-titolo)}
.tile small{color:var(--tenue);font-size:13px;line-height:1.25}
.tile.forte{background:var(--accento);color:var(--su-accento);border-color:var(--accento)}
.tile.forte small{color:inherit;opacity:.85}
.passo-n{display:flex;gap:10px;align-items:flex-start}
.passo-n>.num{flex:0 0 30px;height:30px;border-radius:50%;background:var(--accento);color:var(--su-accento);display:grid;place-items:center;font:800 15px var(--f-titolo)}
.passo-n>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.passo-n h3{margin:4px 0 0;font:800 18px var(--f-titolo)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--scheda);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;border-radius:9px;padding:8px;background:none;color:var(--inchiostro);font:700 14px var(--f-testo);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pannello);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.qui{background:var(--scheda);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.qui small{color:var(--tenue);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.qui b{font:800 20px var(--f-titolo)}
.avviso{background:var(--scheda);border-left:4px solid var(--percorso);border-radius:10px;padding:10px 12px;font-size:14px}
.gioco{background:var(--scheda);border-radius:12px;padding:8px 12px;font-size:14.5px}
.attrib{position:absolute;right:62px;bottom:10px;font-size:10px;color:var(--tenue);background:var(--pannello);border-radius:6px;padding:1px 6px;display:none}
.attrib.on{display:block}
input.testo,textarea{padding:9px;border-radius:10px;border:1px solid var(--linea);background:var(--carta);color:var(--inchiostro);font:inherit;width:100%;box-sizing:border-box}
</style>

<div id="app">
 <div id="mappa"><canvas id="cv" aria-label="Mappa della Lombardia"></canvas>

 </div>

<script>
// [nome, lat, lon, raggio in metri, tipo, racconto]
// tipo: c = città, p = paese, m = monumento, n = natura (lago, monte, fiume, parco)
const LUOGHI=[
// ---- Lallio e dintorni ----
['Lallio',45.6636,9.6289,1200,'p','Sei a Lallio, che in dialetto si chiama Lai. È un paese piccolo, poco più di due chilometri quadrati, a circa cinque chilometri a sud-ovest di Bergamo, e ci vivono più di quattromiladuecento persone. Il nome forse viene dal latino alea, che vuol dire dado da gioco: per questo nello stemma del paese c\'è una scacchiera.'],
['Treviolo',45.6727,9.6136,1300,'p','Stai passando vicino a Treviolo, un paese tra Bergamo e il fiume Brembo. Una volta qui c\'erano soprattutto campi e cascine; oggi ci sono case, negozi e piste ciclabili.'],
['Dalmine',45.6472,9.6056,2000,'c','Lì vicino c\'è Dalmine, famosa in tutto il mondo per la sua grande acciaieria, che fa tubi d\'acciaio da più di cento anni. Molte case del paese sono state costruite proprio per chi lavorava in fabbrica.'],
['Stezzano',45.6499,9.6517,1300,'p','Qui vicino c\'è Stezzano, un paese della pianura con un parco tecnologico tutto rosso, il Kilometro Rosso, dove lavorano scienziati e ingegneri.'],
['Curno',45.6895,9.6131,1200,'p','Ecco Curno, alle porte di Bergamo. È un paese pieno di negozi, ma ha anche un centro antico con la sua chiesa.'],
['Aeroporto di Orio al Serio',45.6689,9.7042,2500,'m','Laggiù c\'è l\'aeroporto di Bergamo Orio al Serio, uno dei più usati d\'Italia. Se guardi in alto, forse vedi un aereo che decolla o atterra.'],
['Grassobbio',45.6563,9.7246,1200,'p','Qui c\'è Grassobbio, vicino al fiume Serio e all\'aeroporto. Lungo il fiume c\'è un bel parco per camminare.'],
// ---- Bergamo ----
['Bergamo',45.6983,9.6773,3500,'c','Benvenuto a Bergamo! La città ha due parti: Bergamo Bassa, in pianura, moderna e piena di vita, e Bergamo Alta, la Città Alta, chiusa dentro le mura veneziane in cima al colle. Bergamo è circondata dalle Prealpi e dalla pianura.'],
['Stazione di Bergamo',45.6908,9.6752,250,'m','Sei alla stazione di Bergamo. Da qui partono i treni per Milano, Brescia e Lecco. Davanti alla stazione comincia il viale lungo e dritto che porta verso Città Alta.'],
['Porta Nuova',45.6956,9.6704,250,'m','Questa è Porta Nuova, con due piccoli edifici a colonne che sembrano templi greci. È il cuore di Bergamo Bassa: da qui si vede la Città Alta sul colle, proprio davanti a te.'],
['Sentierone',45.6948,9.6713,250,'m','Ecco il Sentierone, la passeggiata più famosa di Bergamo Bassa, con alberi, panchine e bar. Qui vicino c\'è il Teatro Donizetti, dedicato al grande compositore di opere nato a Bergamo.'],
['Teatro Donizetti',45.6941,9.6738,200,'m','Questo è il Teatro Donizetti. Gaetano Donizetti era un musicista nato a Bergamo duecento anni fa: scriveva opere liriche, cioè storie cantate, che ancora oggi si ascoltano in tutto il mondo.'],
['Funicolare di Città Alta',45.6997,9.6657,200,'m','Questa è la funicolare: un trenino che sale in salita, tirato da un cavo, dal 1887. In pochi minuti ti porta da Bergamo Bassa fino in Città Alta.'],
['Mura veneziane',45.7010,9.6640,350,'m','Stai vedendo le Mura veneziane di Bergamo. Le hanno costruite i veneziani più di quattrocento anni fa per difendere la città. Sono lunghe più di sei chilometri e sono patrimonio dell\'umanità UNESCO. Da sopra le mura si vede tutta la pianura.'],
['Porta San Giacomo',45.7006,9.6619,200,'m','Questa è Porta San Giacomo, la porta più elegante delle mura, tutta di pietra bianca e rosa. Una volta di notte le porte venivano chiuse e nessuno poteva entrare.'],
['Piazza Vecchia',45.7037,9.6625,180,'m','Sei in Piazza Vecchia, il cuore di Città Alta. Al centro c\'è la fontana Contarini, con i leoni. Davanti a te c\'è il Palazzo della Ragione, il più antico palazzo comunale d\'Italia, e accanto la torre civica, il Campanone, che ogni sera alle dieci suona cento rintocchi.'],
['Cappella Colleoni',45.7032,9.6620,140,'m','Questa è la Cappella Colleoni, con la facciata di marmi bianchi, rossi e neri. Bartolomeo Colleoni era un famoso comandante di soldati: la fece costruire per essere sepolto qui. Accanto c\'è la basilica di Santa Maria Maggiore, piena di decorazioni d\'oro.'],
['Rocca di Bergamo',45.7044,9.6670,200,'m','Ecco la Rocca, una fortezza sul colle di Sant\'Eufemia. Dentro c\'è un museo e intorno un parco, da cui si vede la città dall\'alto.'],
['Castello di San Vigilio',45.7078,9.6505,250,'m','Sei sul colle di San Vigilio, il punto più alto di Bergamo. Qui c\'è un antico castello e una vista bellissima: nelle giornate limpide si vedono gli Appennini, dall\'altra parte della pianura.'],
['Accademia Carrara',45.7041,9.6758,200,'m','Qui c\'è l\'Accademia Carrara, un museo pieno di quadri famosi, dipinti da grandi artisti italiani come Raffaello, Mantegna e Botticelli.'],
['Stadio di Bergamo',45.7088,9.6808,300,'m','Laggiù c\'è lo stadio di Bergamo, dove gioca l\'Atalanta. Nei giorni di partita si sentono i tifosi cantare da lontano.'],
// ---- Valli bergamasche ----
['Valle Brembana',45.8300,9.6400,6000,'n','Stai entrando nella Valle Brembana, la valle del fiume Brembo. Ci sono paesi di montagna, ponti di pietra e boschi. Più in alto ci sono le piste da sci e i laghetti alpini.'],
['San Pellegrino Terme',45.8357,9.6644,1200,'p','Ecco San Pellegrino Terme, famosa per la sua acqua minerale e per il Casinò, un palazzo elegante in stile liberty di più di cento anni fa.'],
['Valle Seriana',45.8100,9.8200,6000,'n','Qui comincia la Valle Seriana, la valle del fiume Serio. Una volta era piena di fabbriche di tessuti. In fondo alla valle ci sono le Cascate del Serio, tra le più alte d\'Italia.'],
['Clusone',45.8870,9.9481,1200,'p','Sei a Clusone, in Val Seriana. Qui c\'è un affresco famoso, la Danza Macabra, dove gli scheletri ballano con re, ricchi e poveri: voleva dire che davanti alla morte siamo tutti uguali.'],
['Cascate del Serio',46.0347,10.0115,1500,'n','Qui vicino ci sono le Cascate del Serio: l\'acqua salta giù per più di trecento metri. Si aprono solo in alcuni giorni d\'estate, quando aprono la diga, e arriva tanta gente a vederle.'],
['Crespi d\'Adda',45.5935,9.5376,700,'m','Questo è Crespi d\'Adda, un villaggio costruito alla fine dell\'Ottocento da una famiglia di industriali per gli operai della loro fabbrica di cotone. C\'erano case, scuola, chiesa e ospedale. È patrimonio dell\'umanità UNESCO.'],
['Treviglio',45.5210,9.5930,1500,'c','Sei a Treviglio, nella Bassa bergamasca. In piazza c\'è una grande torre campanaria, e vicino c\'è il santuario della Madonna delle Lacrime.'],
['Caravaggio',45.4972,9.6430,1500,'p','Ecco Caravaggio. Da qui prende il nome il grande pittore Michelangelo Merisi, detto il Caravaggio, che ha cambiato il modo di dipingere la luce. Poco fuori dal paese c\'è un enorme santuario.'],
['Lago di Endine',45.7790,9.9420,2500,'n','Qui c\'è il Lago di Endine, un lago lungo e stretto tra i monti. D\'inverno, quando fa molto freddo, a volte gela.'],
// ---- Milano ----
['Milano',45.4642,9.1900,6000,'c','Benvenuto a Milano, il capoluogo della Lombardia e una delle città più grandi d\'Italia. È la città della moda, del lavoro, dei grattacieli e del Duomo. Ci vivono più di un milione e trecentomila persone.'],
['Duomo di Milano',45.4642,9.1916,220,'m','Davanti a te c\'è il Duomo di Milano, una delle chiese più grandi del mondo. L\'hanno costruito in quasi seicento anni! È tutto di marmo e ha più di tremila statue. In cima, sulla guglia più alta, brilla la Madonnina d\'oro.'],
['Galleria Vittorio Emanuele II',45.4659,9.1900,180,'m','Questa è la Galleria Vittorio Emanuele, una strada coperta da un tetto di vetro e ferro. Sul pavimento c\'è il mosaico di un toro: la tradizione dice che porta fortuna girare sopra con il tallone.'],
['Teatro alla Scala',45.4674,9.1895,180,'m','Ecco il Teatro alla Scala, uno dei teatri d\'opera più famosi del mondo. Fuori sembra semplice, ma dentro è tutto rosso e oro, con tantissimi palchi.'],
['Pinacoteca di Brera',45.4719,9.1881,250,'m','Sei a Brera, il quartiere degli artisti, con viuzze e piccoli bar. Qui c\'è la Pinacoteca, un museo con quadri bellissimi, come il Bacio di Francesco Hayez.'],
['Castello Sforzesco',45.4705,9.1793,280,'m','Questo è il Castello Sforzesco, costruito dai duchi di Milano, gli Sforza. Dentro ci sono musei e l\'ultima statua di Michelangelo. Leonardo da Vinci ha lavorato qui e ha dipinto una sala tutta coperta di alberi.'],
['Parco Sempione',45.4725,9.1752,400,'n','Ecco il Parco Sempione, il grande parco dietro al Castello. Qui i milanesi vengono a correre, a fare picnic e a giocare. Da qui si vede l\'Arco della Pace.'],
['Arco della Pace',45.4757,9.1725,200,'m','Questo è l\'Arco della Pace, un grande arco di marmo bianco. In cima ci sono sei cavalli di bronzo che tirano un carro. Lo hanno cominciato ai tempi di Napoleone.'],
['Santa Maria delle Grazie',45.4659,9.1709,200,'m','Qui c\'è la chiesa di Santa Maria delle Grazie. In una sala accanto c\'è l\'Ultima Cena di Leonardo da Vinci, uno dei dipinti più famosi del mondo. Per vederla bisogna prenotare, perché è molto delicata.'],
['Basilica di Sant\'Ambrogio',45.4623,9.1754,200,'m','Ecco la basilica di Sant\'Ambrogio, una delle chiese più antiche di Milano. Ambrogio è il santo patrono della città: il 7 dicembre a Milano è festa.'],
['Colonne di San Lorenzo',45.4580,9.1815,180,'m','Queste sono le Colonne di San Lorenzo: sedici colonne di marmo dell\'epoca degli antichi Romani, quando Milano si chiamava Mediolanum. Dietro c\'è la basilica di San Lorenzo.'],
['Darsena e Navigli',45.4525,9.1785,350,'n','Sei sui Navigli, i canali di Milano. Una volta le barche portavano qui il marmo per costruire il Duomo. Oggi sulle rive ci sono locali, mercatini e tanta gente la sera.'],
['Stazione Centrale',45.4862,9.2045,300,'m','Ecco la Stazione Centrale di Milano, enorme, con soffitti altissimi e statue. Ogni giorno passano qui centinaia di treni.'],
['Grattacielo Pirelli',45.4848,9.2004,250,'m','Quel grattacielo sottile è il Pirellone, costruito negli anni Cinquanta. Per tanto tempo è stato l\'edificio più alto d\'Italia.'],
['Piazza Gae Aulenti',45.4840,9.1895,250,'m','Sei nel quartiere di Porta Nuova, con i grattacieli moderni di vetro. La torre con la punta è la più alta d\'Italia. Qui vicino c\'è il Bosco Verticale: due palazzi coperti di alberi veri.'],
['Bosco Verticale',45.4855,9.1904,200,'m','Questi sono i palazzi del Bosco Verticale: sui balconi crescono centinaia di alberi e migliaia di piante. Puliscono l\'aria e ospitano uccellini.'],
['Stadio di San Siro',45.4781,9.1240,500,'m','Laggiù c\'è lo stadio di San Siro, dove giocano il Milan e l\'Inter. È uno degli stadi più grandi d\'Europa, con le sue torri a spirale.'],
['Idroscalo',45.4630,9.2880,1200,'n','Questo è l\'Idroscalo, un grande lago artificiale vicino all\'aeroporto di Linate. Una volta ci atterravano gli idrovolanti; oggi si fa canottaggio, si corre e si va in bici.'],
// ---- Monza e Brianza ----
['Monza',45.5845,9.2744,3000,'c','Sei a Monza, il capoluogo della Brianza. Nel Duomo c\'è la Corona Ferrea, una corona antichissima usata per incoronare i re d\'Italia.'],
['Villa Reale di Monza',45.5893,9.2747,350,'m','Questa è la Villa Reale di Monza, un palazzo enorme dove venivano i re d\'Italia. Dietro c\'è il Parco di Monza, uno dei parchi recintati più grandi d\'Europa.'],
['Autodromo di Monza',45.6206,9.2848,1500,'m','Dentro il parco c\'è l\'Autodromo di Monza, il Tempio della Velocità. Ogni anno qui si corre il Gran Premio d\'Italia di Formula 1.'],
// ---- Como, Lecco e il lago ----
['Como',45.8081,9.0852,2500,'c','Benvenuto a Como, sulla punta sud del Lago di Como. Qui è nato Alessandro Volta, che ha inventato la pila elettrica. La città antica è chiusa dentro mura medievali.'],
['Duomo di Como',45.8117,9.0853,180,'m','Ecco il Duomo di Como, fatto di marmo, con una grande cupola. Ai lati della porta ci sono le statue di Plinio il Vecchio e Plinio il Giovane, due scrittori romani nati a Como.'],
['Tempio Voltiano',45.8139,9.0765,200,'m','Questo edificio rotondo è il Tempio Voltiano, un museo dedicato ad Alessandro Volta. Dentro ci sono i suoi strumenti e le sue prime pile elettriche.'],
['Villa Olmo',45.8200,9.0680,250,'m','Ecco Villa Olmo, una grande villa bianca affacciata sul lago, con un giardino all\'italiana. D\'estate ci sono mostre e concerti.'],
['Brunate',45.8191,9.0960,800,'p','Lassù c\'è Brunate, il balcone sulle Alpi. Ci si arriva con la funicolare da Como, e dal faro si vedono il lago, la città e, nelle giornate limpide, il Monte Rosa.'],
['Lago di Como',45.9800,9.2600,9000,'n','Stai vicino al Lago di Como, chiamato anche Lario. Ha la forma di una Y rovesciata ed è uno dei laghi più profondi d\'Europa: in certi punti supera i quattrocento metri. Sulle rive ci sono ville eleganti e paesini colorati.'],
['Bellagio',45.9853,9.2575,900,'p','Ecco Bellagio, la perla del lago, proprio dove il lago si divide in due rami. Ha vicoli a scalini, giardini e ville storiche.'],
['Varenna',46.0105,9.2840,700,'p','Sei a Varenna, un borgo di case colorate sulla riva del lago. Sopra il paese c\'è il Castello di Vezio, da cui si vede tutto il lago.'],
['Lecco',45.8566,9.3977,2500,'c','Ecco Lecco, sul ramo del lago chiamato appunto ramo di Lecco. Qui Alessandro Manzoni ha ambientato I Promessi Sposi, con Renzo e Lucia. Sopra la città ci sono le montagne del Resegone.'],
['Resegone',45.8580,9.4740,4000,'n','Quella montagna con tante punte è il Resegone: si chiama così perché sembra una grande sega. È la montagna simbolo di Lecco.'],
['Grigne',45.9300,9.3870,5000,'n','Quelle montagne rocciose sono le Grigne, amate dagli scalatori. Si vedono anche da Milano quando il cielo è pulito.'],
// ---- Varese e Lago Maggiore ----
['Varese',45.8206,8.8251,2500,'c','Sei a Varese, la città giardino, piena di parchi e ville. Vicino ci sono sette laghi, e sopra la città c\'è il Sacro Monte.'],
['Sacro Monte di Varese',45.8600,8.7920,700,'m','Questo è il Sacro Monte di Varese: una strada in salita con quattordici cappelle piene di statue che raccontano storie della Madonna. È patrimonio dell\'umanità UNESCO.'],
['Lago Maggiore',45.9500,8.6500,8000,'n','Qui c\'è il Lago Maggiore, il secondo lago d\'Italia per grandezza. La sponda dove sei è lombarda; quella di fronte è piemontese, e il nord del lago è in Svizzera.'],
['Santa Caterina del Sasso',45.8838,8.6053,500,'m','Ecco l\'eremo di Santa Caterina del Sasso, un monastero costruito su una roccia a strapiombo sul Lago Maggiore. Sembra appeso alla montagna!'],
['Lago di Varese',45.8100,8.7300,3000,'n','Questo è il Lago di Varese. Nel lago c\'è un\'isolina, l\'Isolino Virginia, dove gli archeologi hanno trovato i resti di villaggi su palafitte di migliaia di anni fa.'],
// ---- Brescia e Garda ----
['Brescia',45.5416,10.2118,3500,'c','Benvenuto a Brescia, la seconda città della Lombardia. È chiamata la Leonessa d\'Italia per il coraggio dei suoi abitanti. Ha resti romani, un castello e tante piazze.'],
['Piazza della Loggia',45.5400,10.2198,180,'m','Questa è Piazza della Loggia, con il bel palazzo della Loggia e la torre dell\'orologio con due statue che battono le ore, i Macc de le ure.'],
['Castello di Brescia',45.5434,10.2245,300,'m','Ecco il Castello di Brescia, sul colle Cidneo. Ha mura, torri e cannoni, e dall\'alto si vede tutta la città.'],
['Brixia romana',45.5404,10.2269,200,'m','Qui ci sono i resti della Brescia romana, Brixia, con il Capitolium, un grande tempio con le colonne. Anche questo è patrimonio dell\'umanità UNESCO.'],
['Lago di Garda',45.6000,10.6400,10000,'n','Stai vicino al Lago di Garda, il lago più grande d\'Italia. Il clima qui è mite, e crescono ulivi e limoni come al mare.'],
['Desenzano del Garda',45.4710,10.5390,1300,'c','Sei a Desenzano, sulla riva sud del Garda. Ha un porticciolo vecchio con le barche e una villa romana con mosaici.'],
['Sirmione',45.4934,10.6080,800,'p','Ecco Sirmione, un paese su una penisola lunga e stretta che entra nel lago. Per entrare si passa sul ponte del Castello Scaligero, circondato dall\'acqua.'],
['Grotte di Catullo',45.5010,10.6063,400,'m','In punta alla penisola ci sono le Grotte di Catullo: non sono grotte, ma i resti di una villa romana enorme, affacciata sul lago.'],
['Salò',45.6070,10.5210,1200,'p','Sei a Salò, con un lungolago lunghissimo, uno dei più belli del Garda.'],
['Vittoriale degli Italiani',45.6230,10.5650,400,'m','Qui a Gardone Riviera c\'è il Vittoriale, la casa del poeta Gabriele D\'Annunzio. Nel giardino c\'è persino la prua di una nave vera!'],
['Limone sul Garda',45.8130,10.7910,900,'p','Ecco Limone sul Garda, famosa per le limonaie: giardini di limoni coltivati su terrazze, protetti da muri e pilastri.'],
['Franciacorta',45.6000,9.9900,6000,'n','Sei in Franciacorta, una zona di colline coperte di vigneti tra Brescia e il Lago d\'Iseo.'],
['Lago d\'Iseo',45.7300,10.0700,6000,'n','Questo è il Lago d\'Iseo, chiamato anche Sebino. In mezzo c\'è Monte Isola, l\'isola di lago più grande d\'Europa, dove non circolano le auto.'],
['Monte Isola',45.7150,10.0830,1500,'n','Ecco Monte Isola: un\'isola montagnosa in mezzo al lago, con piccoli paesi di pescatori. Ci si va in battello.'],
['Lovere',45.8120,10.0700,900,'p','Sei a Lovere, sulla punta nord del Lago d\'Iseo. È uno dei borghi più belli d\'Italia, con una piazza sul lago.'],
['Capo di Ponte',46.0300,10.3400,2500,'m','Qui in Val Camonica ci sono le incisioni rupestri: disegni scolpiti sulle rocce dagli uomini antichi, migliaia di anni fa. Ci sono cacciatori, animali e simboli. Sono state il primo patrimonio UNESCO d\'Italia.'],
['Val Camonica',45.9800,10.3000,9000,'n','Stai attraversando la Val Camonica, una lunga valle tra le montagne, percorsa dal fiume Oglio.'],
['Adamello',46.1600,10.5000,9000,'n','Laggiù c\'è il gruppo dell\'Adamello, con uno dei ghiacciai più grandi delle Alpi italiane.'],
// ---- Cremona, Lodi, Mantova ----
['Cremona',45.1335,10.0227,3000,'c','Benvenuto a Cremona, la città dei violini. Qui hanno lavorato grandi liutai come Antonio Stradivari: i suoi violini oggi valgono milioni. È famosa anche per il torrone.'],
['Torrazzo di Cremona',45.1335,10.0247,200,'m','Ecco il Torrazzo, il campanile di Cremona: alto più di cento metri, è uno dei campanili in muratura più alti del mondo. Ha un orologio astronomico enorme.'],
['Museo del Violino',45.1377,10.0213,200,'m','Qui c\'è il Museo del Violino, dove puoi vedere violini antichi preziosissimi e, a volte, ascoltarli suonare.'],
['Lodi',45.3138,9.5034,2000,'c','Sei a Lodi, una città sul fiume Adda. Ha una piazza grande con i portici, e il tempio dell\'Incoronata, tutto decorato d\'oro dentro.'],
['Mantova',45.1564,10.7914,3000,'c','Benvenuto a Mantova, circondata da tre laghi formati dal fiume Mincio. Per secoli è stata la città dei Gonzaga, una famiglia potente. È patrimonio dell\'umanità UNESCO.'],
['Palazzo Ducale di Mantova',45.1600,10.7990,300,'m','Questo è il Palazzo Ducale dei Gonzaga, una specie di città dentro la città, con centinaia di stanze. C\'è la Camera degli Sposi dipinta da Mantegna, con un buco nel soffitto finto da cui sembrano guardarti delle persone.'],
['Palazzo Te',45.1489,10.7944,250,'m','Ecco Palazzo Te, una villa per le feste dei Gonzaga. Nella Sala dei Giganti le pareti sono dipinte con giganti che crollano: sembra che il soffitto ti cada addosso!'],
['Sabbioneta',44.9990,10.4890,800,'p','Questa è Sabbioneta, la città ideale: un duca l\'ha costruita da zero, tutta insieme, con strade dritte e mura a stella.'],
['Fiume Po',45.0400,10.3000,7000,'n','Sei vicino al Po, il fiume più lungo d\'Italia. Segna il confine sud della Lombardia per tanti chilometri.'],
// ---- Pavia ----
['Pavia',45.1847,9.1582,2500,'c','Sei a Pavia, sul fiume Ticino. Ha una delle università più antiche del mondo e tante torri medievali.'],
['Ponte Coperto',45.1820,9.1550,250,'m','Ecco il Ponte Coperto sul Ticino: un ponte con un tetto sopra, e una piccola cappella in mezzo.'],
['Certosa di Pavia',45.2570,9.1405,600,'m','Questa è la Certosa di Pavia, un monastero meraviglioso con una facciata di marmi colorati e statue. Ci vivono ancora dei monaci.'],
['Vigevano',45.3170,8.8580,1500,'c','Sei a Vigevano. La sua Piazza Ducale, con i portici tutto intorno, è una delle più belle d\'Italia. Leonardo da Vinci è passato di qui.'],
['Oltrepò Pavese',44.9000,9.2000,9000,'n','Qui comincia l\'Oltrepò Pavese, la parte di Lombardia a sud del Po, con colline, vigneti e castelli.'],
['Fiume Ticino',45.3500,8.8400,5000,'n','Sei vicino al Ticino, un fiume con acqua chiara e boschi ai lati. Intorno c\'è il Parco del Ticino, dove vivono aironi e caprioli.'],
// ---- Sondrio e montagne ----
['Sondrio',46.1699,9.8715,2500,'c','Benvenuto a Sondrio, il capoluogo della Valtellina. Intorno, sulle montagne, ci sono i terrazzamenti con le vigne, costruiti a mano con muretti di pietra.'],
['Valtellina',46.1700,9.9500,12000,'n','Stai attraversando la Valtellina, la valle del fiume Adda tra le Alpi. Qui si mangiano i pizzoccheri e la bresaola.'],
['Teglio',46.1720,10.0640,900,'p','Ecco Teglio, il paese da cui prende il nome la Valtellina. È la patria dei pizzoccheri, la pasta di grano saraceno.'],
['Bormio',46.4670,10.3700,1500,'p','Sei a Bormio, famosa per le terme e per le piste da sci. Da qui parte la strada per il Passo dello Stelvio.'],
['Passo dello Stelvio',46.5286,10.4532,1500,'n','Lassù c\'è il Passo dello Stelvio, a più di duemilasettecento metri: una delle strade più alte d\'Europa, con decine di tornanti.'],
['Livigno',46.5380,10.1350,2000,'p','Ecco Livigno, un paese di alta montagna con tantissima neve d\'inverno. È uno dei posti più freddi d\'Italia.'],
['Chiavenna',46.3200,9.3980,1200,'p','Sei a Chiavenna, una cittadina antica tra le montagne, con i crotti: grotte naturali fresche dove si conservano i cibi.'],
['Pizzo Bernina',46.3820,9.9080,9000,'n','Laggiù, sul confine con la Svizzera, c\'è il Bernina, la montagna più alta della Lombardia, oltre quattromila metri.'],
// ---- fiumi ----
['Fiume Adda',45.6200,9.5100,3000,'n','Sei vicino all\'Adda, il fiume che esce dal Lago di Como e scende verso il Po. Leonardo da Vinci lo disegnava spesso.'],
['Fiume Brembo',45.7000,9.5900,2500,'n','Qui scorre il Brembo, il fiume che scende dalla Valle Brembana e si getta nell\'Adda.'],
['Fiume Serio',45.6700,9.7300,2500,'n','Questo è il Serio, il fiume della Valle Seriana. Più a sud passa vicino a Crema.'],
['Crema',45.3627,9.6852,1500,'c','Sei a Crema, una città elegante con un bel Duomo bianco e rosso e una piazza circondata dai portici.'],
];

// il giro di Lallio: racconti a capitoli lungo un giro indicativo intorno al centro (le vie vere arriveranno con la mappa del sito)
const LALLIO={n:'Lallio, la sua storia',d:'Lallio · a piedi · 6 racconti',m:'piedi',p:[[45.6636,9.6289],[45.6650,9.6310],[45.6662,9.6290],[45.6655,9.6262],[45.6636,9.6255],[45.6618,9.6268],[45.6614,9.6295],[45.6622,9.6318],[45.6636,9.6289]],
 cap:[[0,'Benvenuto a Lallio','Ciao e benvenuto a Lallio! In dialetto bergamasco il paese si chiama Lai. È piccolo: in poco più di due chilometri quadrati ci vivono circa quattromiladuecento persone. Bergamo è a cinque chilometri, verso nord-est: nelle giornate limpide, da quella parte, si vede il colle di Città Alta. Pronto? Cominciamo il giro!'],
[0.14,'Il nome e lo stemma','Sai da dove viene il nome Lallio? Forse dal latino alea, che vuol dire dado da gioco. Si racconta che d\'inverno qui si fermassero i soldati romani, e che ci fosse un piccolo forte per controllare la strada verso Bergamo. Per ricordare il dado, nello stemma del paese c\'è una scacchiera, con un angelo. Gioco: quando vedi lo stemma di Lallio, conta le caselle della scacchiera!'],
[0.28,'La chiesa di San Bernardino','La chiesa di San Bernardino è il tesoro di Lallio. È stata costruita verso il 1450, proprio l\'anno in cui Bernardino da Siena fu fatto santo: è una delle prime chiese dedicate a lui. Allora qui intorno c\'erano solo campi. Davanti c\'è un sagrato chiuso da un muro alto, con un portale di pietra. Dentro, le pareti sono coperte di affreschi che raccontano la vita di Maria, quadro dopo quadro, come un fumetto antico. Li hanno dipinti Gerolamo Colleoni e Cristoforo Baschenis il vecchio. Oggi è monumento nazionale. Gioco: se entri, prova a seguire la storia di Maria da un quadro all\'altro.'],

function lungo(p){const cum=[0];for(let i=1;i<p.length;i++)cum.push(cum[i-1]+dist(p[i-1],p[i]));return cum}
function proietta(p,cum,q){let best=[1e12,0];for(let i=1;i<p.length;i++){const a=xy(p[i-1][0],p[i-1][1]),b=xy(p[i][0],p[i][1]),c=xy(q[0],q[1]);const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy||1;let t=((c[0]-a[0])*dx+(c[1]-a[1])*dy)/L;t=Math.max(0,Math.min(1,t));const d=Math.hypot(a[0]+dx*t-c[0],a[1]+dy*t-c[1]);if(d<best[0])best=[d,cum[i-1]+t*(cum[i]-cum[i-1])]}return best}
function tappeDi(T){const p=T.p,cum=lungo(p),tot=cum.at(-1);
 if(T.cap)return T.cap.map(([f,n,txt],i)=>({n,txt,at:f*tot,ico:'📖',clip:'C'+i}));
 const out=[];tutti().forEach(L=>{const [d,at]=proietta(p,cum,[L[1],L[2]]);const lim=L[4]==='m'||L[4]==='x'?Math.min(Math.max(L[3],120),350):Math.min(L[3],T.m==='auto'?4000:2500);if(d<=lim)out.push({n:L[0],txt:L[4]==='x'?L[5]:storia(L),at,ico:ICO[L[4]],L,clip:L[4]==='x'?null:'L'+LI.get(L)})});
 (T.vie||[]).forEach(v=>out.push({n:v.n,txt:v.txt,at:v.at,ico:'🛣️',via:1}));
 return out.sort((a,b)=>a.at-b.at)}

const toS=(la,lo)=>{const p=xy(la,lo);return [W/2+(p[0]-V.cx)*V.z,H/2+(p[1]-V.cy)*V.z]};
const fromS=(sx,sy)=>{const x=(sx-W/2)/V.z+V.cx,y=(sy-H/2)/V.z+V.cy;return [LAT0-y/KY,9.6+x/KX]};
function center(la,lo){const p=xy(la,lo);V.cx=p[0];V.cy=p[1]}
function fit(p,pad){let a=1e9,b=-1e9,c=1e9,d=-1e9;p.forEach(q=>{const s=xy(q[0],q[1]);a=Math.min(a,s[0]);b=Math.max(b,s[0]);c=Math.min(c,s[1]);d=Math.max(d,s[1])});V.cx=(a+b)/2;V.cy=(c+d)/2;V.z=Math.min((W-(pad||70))/Math.max(300,b-a),(H-(pad||90))/Math.max(300,d-c))}
function poly(pts,close){g.beginPath();pts.forEach((p,i)=>{const s=toS(p[0],p[1]);i?g.lineTo(s[0],s[1]):g.moveTo(s[0],s[1])});if(close)g.closePath()}

const TILE=new Map();
function tiles(){if(!SITO||V.z<0.012)return false;const Z=Math.max(10,Math.min(19,Math.round(Math.log2(156543*Math.cos(LAT0*Math.PI/180)*V.z*1.4))));const n=2**Z;
 const tx=lo=>(lo+180)/360*n,ty=la=>{const r=la*Math.PI/180;return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n};const lon=x=>x/n*360-180,lat=y=>Math.atan(Math.sinh(Math.PI*(1-2*y/n)))*180/Math.PI;
 const a=fromS(0,0),b=fromS(W,H);let ok=true;
 for(let x=Math.floor(tx(a[1]));x<=Math.floor(tx(b[1]));x++)for(let y=Math.floor(ty(a[0]));y<=Math.floor(ty(b[0]));y++){const k=Z+'/'+x+'/'+y;let im=TILE.get(k);

let drag=null,pin=null;const ptr=new Map();
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.offsetX,e.offsetY]);drag={x:e.offsetX,y:e.offsetY,cx:V.cx,cy:V.cy,mv:0};if(ptr.size===2){const [a,b]=[...ptr.values()];pin={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:V.z}}};
cv.onpointermove=e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,[e.offsetX,e.offsetY]);if(ptr.size===2&&pin){const [a,b]=[...ptr.values()];V.z=Math.max(.0003,Math.min(1.5,pin.z*Math.hypot(a[0]-b[0],a[1]-b[1])/pin.d));draw();return}
 if(!drag)return;const dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;drag.mv=Math.max(drag.mv,Math.abs(dx)+Math.abs(dy));if(drag.mv>6){S.segui=false;V.cx=drag.cx-dx/V.z;V.cy=drag.cy-dy/V.z;draw()}};
cv.onpointerup=e=>{ptr.delete(e.pointerId);if(ptr.size<2)pin=null;if(drag&&drag.mv<=6){const q=fromS(e.offsetX,e.offsetY);
  if(schermo==='crea'&&S.attesa!=null&&S.campi[S.attesa]){S.campi[S.attesa].pt=q;S.campi[S.attesa].err='';S.attesa=null;render()}
  else if((schermo==='dove'||schermo==='mio')&&!S.gps){S.dir=brg(S.pos,q);S.pos=q;nuovaPos();render()}}
 if(!ptr.size)drag=null};
cv.onwheel=e=>{e.preventDefault();const f=e.deltaY<0?1.2:1/1.2,p=fromS(e.offsetX,e.offsetY),q=xy(p[0],p[1]);V.z=Math.max(.0003,Math.min(1.5,V.z*f));V.cx=q[0]-(e.offsetX-W/2)/V.z;V.cy=q[1]-(e.offsetY-H/2)/V.z;draw()};
$('zin').onclick=()=>{V.z=Math.min(1.5,V.z*1.6);draw()};$('zout').onclick=()=>{V.z=Math.max(.0003,V.z/1.6);draw()};$('segui').onclick=()=>{S.segui=true;center(...S.pos);draw()};
addEventListener('resize',size);try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw)}catch(e){}
let instEv=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEv=e;if(schermo==='home')render()});
if(SITO&&'serviceWorker' in navigator)try{navigator.serviceWorker.register('sw.js')}catch(e){}
size();vai('home');
</script>
