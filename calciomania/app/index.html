<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="description" content="Calciomania PM: fonda la tua società di calcio e portala dalla Terza Categoria alla Serie A. Giocatori, staff, stadio e gironi online.">
<title>Calciomania PM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* CALCIOMANIA PM — tema scuro premium.
   Nero antracite, verde campo scuro, verde acceso per le azioni, bianco per il testo, oro per premi e soldi.
   Telefono: barra in basso. Computer: barra laterale. */
:root{
  --bg:#0b0d10;--bg2:#0f1216;--pan:#13171c;--pan2:#181d23;--pan3:#1e242b;--linea:rgba(255,255,255,.07);--linea2:rgba(255,255,255,.12);
  --testo:#f4f6f8;--tenue:#8b95a1;--tenue2:#5d6773;--campo:#0f3b2a;--campo2:#145238;--verde:#22c55e;--verde2:#16a34a;--verdeT:rgba(34,197,94,.12);
  --oro:#d4af37;--oro2:#f0d77a;--oroT:rgba(212,175,55,.12);--rosso:#ef4444;--rossoT:rgba(239,68,68,.12);--giallo:#eab308;--gialloT:rgba(234,179,8,.12);--blu:#3b82f6;--bluT:rgba(59,130,246,.12);
  --f-tit:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--f:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --sx:max(16px,env(safe-area-inset-left,0px));--dx:max(16px,env(safe-area-inset-right,0px));--r:16px;--ombra:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -18px rgba(0,0,0,.9);
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--testo);font:15px/1.5 var(--f);min-height:100vh;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
body.in-partita{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--testo)}
h1,h2,h3,h4{font-family:var(--f-tit);letter-spacing:.01em;margin:0 0 .4em;line-height:1.1;font-weight:700}
h2{font-size:26px}h3{font-size:18px;text-transform:uppercase;letter-spacing:.04em}h4{font-size:15px;color:var(--tenue);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px}
p{margin:.3em 0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}
.ic.oro{color:var(--oro)}.ic.verde{color:var(--verde)}.ic.rosso{color:var(--rosso)}.ic.gira{transform:rotate(90deg)}
.tenue{color:var(--tenue)}.verde{color:var(--verde)}.rosso{color:var(--rosso)}.giallo{color:var(--giallo)}.oro{color:var(--oro)}.centro{text-align:center}
.nota{color:var(--tenue);font-size:13px;margin:.5em 0}
a{color:var(--oro)}
#app{min-height:100vh}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#262d35;border-radius:8px}

/* struttura */
.shell{min-height:100vh}
.side{display:none}
.main{max-width:760px;margin:0 auto;min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) var(--dx) 10px var(--sx);background:rgba(11,13,16,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--linea)}
.club{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-align:left}
.club b{display:block;font:700 19px/1.05 var(--f-tit);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.club small{display:block;font-size:12px;color:var(--tenue);white-space:nowrap}
.club small::before{content:'';display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--c);margin-right:6px;vertical-align:1px}
.club>span{min-width:0}
.online-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--verde);box-shadow:0 0 8px var(--verde);vertical-align:1px}
.soldi{display:flex;align-items:center;gap:4px;font:700 18px var(--f-tit);color:var(--oro);background:var(--oroT);border:1px solid rgba(212,175,55,.28);padding:5px 12px 5px 9px;border-radius:999px;white-space:nowrap}
.soldi .ic{width:16px;height:16px}
.soldi.rosso{color:var(--rosso);border-color:rgba(239,68,68,.35);background:var(--rossoT)}
.menu-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--pan2);border:1px solid var(--linea)}
.menu-btn .ic{width:22px;height:22px;transition:transform .4s}.menu-btn:active .ic{transform:rotate(90deg)}
.subnav{position:sticky;top:calc(61px + env(safe-area-inset-top,0px));z-index:15;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:8px var(--dx) 8px var(--sx);background:rgba(11,13,16,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--linea)}
.subnav::-webkit-scrollbar{display:none}
.subnav button{position:relative;flex:none;display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;font-weight:600;font-size:14px;color:var(--tenue);transition:background .2s,color .2s}
.subnav button .ic{width:17px;height:17px}
.subnav button.on{background:var(--pan3);color:var(--testo);box-shadow:inset 0 -2px 0 var(--verde)}
.num-b{font:700 11px/18px var(--f);font-style:normal;min-width:18px;height:18px;border-radius:9px;background:var(--oro);color:#1a1405;text-align:center;padding:0 5px}
.schermo{padding:16px var(--dx) calc(100px + env(safe-area-inset-bottom,0px)) var(--sx);display:flex;flex-direction:column;gap:14px;animation:appare .25s ease-out}
@keyframes appare{from{opacity:0;transform:translateY(6px)}}
.barra{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:rgba(11,13,16,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--linea);padding:6px var(--dx) calc(6px + env(safe-area-inset-bottom,0px)) var(--sx)}
.barra button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--tenue2);font-size:11px;font-weight:600;position:relative;border-radius:12px;transition:color .2s}
.barra .ic{width:23px;height:23px}
.barra button.on{color:var(--verde)}
.barra button.on::before{content:'';position:absolute;top:-7px;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--verde);box-shadow:0 0 12px var(--verde)}
.pallino{position:absolute;top:4px;right:calc(50% - 17px);width:8px;height:8px;border-radius:50%;background:var(--oro);box-shadow:0 0 0 2px var(--bg)}
.pallino.blu{background:var(--blu)}.pallino.rosso{background:var(--rosso)}
@media (min-width:1000px){
  .shell{display:grid;grid-template-columns:250px 1fr}
  .side{display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;padding:22px 16px;background:linear-gradient(180deg,#0e1115,#0b0d10);border-right:1px solid var(--linea)}
  .side-logo{font:800 22px/1 var(--f-tit);letter-spacing:.08em;padding:0 8px}.side-logo span{color:var(--verde);margin-left:6px}
  .side-club{display:flex;align-items:center;gap:10px;text-align:left;padding:12px;border-radius:14px;background:var(--pan);border:1px solid var(--linea)}
  .side-club b{display:block;font:700 18px/1.05 var(--f-tit)}.side-club small{color:var(--tenue);font-size:12px}
  .side-nav{display:flex;flex-direction:column;gap:2px}
  .side-nav button{position:relative;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:600;color:var(--tenue);transition:background .2s,color .2s}
  .side-nav button:hover{background:var(--pan);color:var(--testo)}
  .side-nav button.on{background:linear-gradient(90deg,var(--verdeT),transparent);color:var(--testo);box-shadow:inset 3px 0 var(--verde)}
  .side-nav button.on .ic{color:var(--verde)}
  .side-nav .pallino{position:static;margin-left:auto}
  .side-soldi{margin-top:auto;padding:14px;border-radius:14px;background:var(--oroT);border:1px solid rgba(212,175,55,.25);display:flex;flex-direction:column}
  .side-soldi small{color:var(--tenue);font-size:12px}.side-soldi b{font:700 22px var(--f-tit);color:var(--oro)}
  .side-menu{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--tenue);font-weight:600}.side-menu:hover{background:var(--pan)}
  .main{max-width:1180px;width:100%}
  .top{display:none}
  .subnav{top:0;padding:10px 28px}
  .barra{display:none}
  .schermo{padding:22px 28px 40px}
  .avviso{bottom:30px}
}

/* carte */
.carta{background:linear-gradient(180deg,var(--pan2),var(--pan));border:1px solid var(--linea);border-radius:var(--r);padding:16px;box-shadow:var(--ombra);min-width:0}
.carta-tit{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.carta-tit h3{margin:0;display:flex;align-items:center;gap:8px}
.carta.vuoto{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.griglia{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:760px){.griglia{grid-template-columns:1fr 1fr}.griglia>.largo2{grid-column:1/-1}.griglia.tat>section:first-child{grid-row:span 2}}
.dash{display:flex;flex-direction:column;gap:14px}
.link{color:var(--oro);font-weight:600;font-size:13.5px;white-space:nowrap}
.link.rosso{color:var(--rosso)}

/* bottoni */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;font-weight:700;font-size:15px;background:var(--verde);color:#04170b;box-shadow:0 8px 20px -10px rgba(34,197,94,.8);transition:transform .12s,filter .2s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn.oro{background:linear-gradient(180deg,var(--oro2),var(--oro));color:#241a02;box-shadow:0 8px 24px -10px rgba(212,175,55,.8)}
.btn.sec{background:var(--pan3);color:var(--testo);box-shadow:none;border:1px solid var(--linea2)}
.btn.rosso{background:var(--rosso);color:#fff;box-shadow:none}
.btn.sec.rosso{background:var(--rossoT);color:var(--rosso);border-color:rgba(239,68,68,.3)}
.btn.mini{min-height:36px;padding:6px 12px;font-size:13.5px;border-radius:10px;white-space:nowrap}
.btn.largo{width:100%}
.btn:disabled{opacity:.35;box-shadow:none;filter:none;cursor:default}
.riga-btn{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.riga-btn .btn{flex:1}

/* prossima partita */
.hero-match{position:relative;border-radius:20px;padding:18px;overflow:hidden;border:1px solid rgba(34,197,94,.2);
  background:radial-gradient(80% 70% at 50% -10%,rgba(34,197,94,.22),transparent 70%),repeating-linear-gradient(90deg,var(--campo) 0 40px,#11432f 40px 80px);box-shadow:0 24px 50px -28px #000,inset 0 0 90px rgba(0,0,0,.5)}
.hero-match::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,13,16,.15),rgba(11,13,16,.78));pointer-events:none}
.hero-match::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.07)}
.hero-match>*{position:relative;z-index:1}
.hm-top{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:#b9e8c8;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.hm-squadre{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin:16px 0 12px}
.hm-t{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0}
.hm-t .stemma{filter:drop-shadow(0 10px 14px rgba(0,0,0,.6))}
.hm-t b{font:700 20px/1.05 var(--f-tit);max-width:100%;overflow-wrap:anywhere}
.hm-t small{color:#a7d9b8;font-size:12px}
.hm-vs b{display:block;font:800 30px var(--f-tit);color:#fff;opacity:.9;text-align:center}
.hm-vs small{font-size:11px;color:#b9e8c8;white-space:nowrap;text-transform:uppercase;letter-spacing:.08em}
.hm-conf{display:flex;align-items:center;gap:10px;font-size:12px;color:#cfe9d8;margin-bottom:8px}
.hm-bar{flex:1;height:6px;border-radius:3px;background:rgba(239,68,68,.55);overflow:hidden}.hm-bar i{display:block;height:100%;background:var(--verde);border-radius:3px}
.hm-info{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:#cfe9d8;margin-bottom:12px}
.gioca-riga{display:flex;gap:8px}
.btn-gioca{flex:1;width:100%;min-height:58px;border-radius:14px;font:800 21px var(--f-tit);letter-spacing:.08em;color:#04170b;background:linear-gradient(180deg,#4ade80,var(--verde));box-shadow:0 14px 30px -12px rgba(34,197,94,.9);animation:pulsa 2.4s infinite;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-gioca .ic{width:24px;height:24px;fill:currentColor}
.btn-gioca.occupato{opacity:.6;animation:none}
.btn-sim{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:78px;border-radius:14px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.14);font-size:12px;font-weight:600;color:#d7f5e1}
@keyframes pulsa{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5),0 14px 30px -12px rgba(34,197,94,.9)}70%{box-shadow:0 0 0 12px rgba(34,197,94,0),0 14px 30px -12px rgba(34,197,94,.9)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0),0 14px 30px -12px rgba(34,197,94,.9)}}
.problemi{display:flex;flex-direction:column;gap:8px}
.problema{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:rgba(0,0,0,.5);border:1px solid rgba(234,179,8,.35);color:#fde68a;padding:12px 14px;border-radius:12px;font-weight:600}
.problema span{font-size:22px;color:var(--giallo)}
.attesa{background:rgba(0,0,0,.5);border-radius:14px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--verde);animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.hero-match .nota{color:#b9e8c8;text-align:center}

/* avvisi e per iniziare */
.avv-r{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 4px;border-top:1px solid var(--linea);font-size:14px}
.avv-r:first-of-type{border-top:0}
.avv-r>span{flex:1;min-width:0}.avv-r>b{color:var(--tenue2)}
.avv-r .ic{width:30px;height:30px;padding:6px;border-radius:9px;background:var(--pan3)}
.avv-r.rosso .ic{color:var(--rosso);background:var(--rossoT)}.avv-r.giallo .ic{color:var(--giallo);background:var(--gialloT)}.avv-r.oro .ic{color:var(--oro);background:var(--oroT)}.avv-r.verde .ic{color:var(--verde);background:var(--verdeT)}.avv-r.blu .ic{color:var(--blu);background:var(--bluT)}
.todo{display:flex;flex-direction:column;gap:4px}
.todo-r{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 4px;border-bottom:1px solid var(--linea);font-weight:600}
.todo-r i{width:24px;height:24px;border-radius:50%;border:2px solid var(--tenue2);display:grid;place-items:center;flex:none}
.todo-r i .ic{width:14px;height:14px;stroke-width:3}
.todo-r.ok{color:var(--tenue);text-decoration:line-through}
.todo-r.ok i{background:var(--verde);border-color:var(--verde);color:#04170b}
.todo .btn{margin-top:8px}

/* tessere */
.tessere{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:760px){.tessere{grid-template-columns:repeat(6,1fr)}}
.tessera{background:linear-gradient(180deg,var(--pan2),var(--pan));border:1px solid var(--linea);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;min-width:0}
.tessera span{font-weight:600;font-size:12.5px}
.tessera small{color:var(--tenue);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.anello{--p:.5;--c:var(--verde);width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*360deg),rgba(255,255,255,.07) 0);margin-bottom:4px;position:relative}
.anello::before{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--pan)}
.morale .anello{--c:var(--oro)}.intesa .anello{--c:var(--blu)}.prep .anello{--c:#a78bfa}
.anello b{position:relative;font:700 22px var(--f-tit)}
.numero{font:700 30px/58px var(--f-tit);height:62px}

/* classifica e tabelle */
.tab-wrap{overflow-x:auto;margin:0 -4px}
.tab{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}
.tab th{font:600 11px var(--f);color:var(--tenue2);text-transform:uppercase;letter-spacing:.06em;padding:6px 4px;text-align:center}
.tab td{padding:7px 4px;text-align:center;border-top:1px solid var(--linea);font-variant-numeric:tabular-nums}
.tab .sx{text-align:left}
.tab tr.io td{background:rgba(34,197,94,.09)}
.tab tr.io td:first-child{box-shadow:inset 3px 0 var(--verde)}
.pos{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font:700 14px var(--f-tit);background:var(--pan3)}
tr.promo .pos{background:var(--verde);color:#04170b}
tr.retro .pos{background:var(--rosso);color:#fff}
.sq{display:flex;align-items:center;gap:8px;min-width:0}
.sq>span:not(.tag){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw;font-weight:600}
@media (min-width:1000px){.sq>span:not(.tag){max-width:280px}}
.sq .stemma{flex:none}
.tag{font-size:10px;flex:none;font-weight:700;letter-spacing:.04em}
.tag .ic{width:14px;height:14px}
.tag.tu{background:var(--verde);color:#04170b;padding:1px 6px;border-radius:5px}
.tag.bot{color:var(--tenue2);border:1px solid var(--linea2);padding:0 4px;border-radius:4px}
.tag.umano{color:var(--blu)}
.forma{display:inline-flex;gap:2px}
.forma i{font:700 10px/16px var(--f);width:16px;height:16px;border-radius:4px;font-style:normal;color:#06110c}
.forma .V{background:var(--verde)}.forma .N{background:#9aa4ae}.forma .P{background:var(--rosso);color:#fff}
@media (max-width:560px){.tab:not(.mini) th:nth-child(4),.tab:not(.mini) td:nth-child(4),.tab:not(.mini) th:nth-child(5),.tab:not(.mini) td:nth-child(5),.tab:not(.mini) th:nth-child(6),.tab:not(.mini) td:nth-child(6),.tab:not(.mini) th:nth-child(7),.tab:not(.mini) td:nth-child(7),.tab:not(.mini) th:nth-child(8),.tab:not(.mini) td:nth-child(8),.tab:not(.mini) th:last-child,.tab:not(.mini) td:last-child{display:none}}
.legenda{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--tenue)}
.legenda .q{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.q.promo{background:var(--verde)}.q.retro{background:var(--rosso)}
.tabs{display:flex;gap:4px;background:var(--pan);border:1px solid var(--linea);padding:4px;border-radius:12px}
.tabs button{flex:1;padding:8px 6px;border-radius:9px;font-weight:600;color:var(--tenue);font-size:14px}
.tabs button.on{background:var(--pan3);color:var(--testo)}
.tabs.piccole{margin-top:10px}
.cal{display:flex;flex-direction:column}
.cal-r{display:flex;align-items:center;gap:9px;padding:8px 4px;border-top:1px solid var(--linea)}
.cal-r.ora{background:var(--verdeT);border-radius:10px}
.cal-r .g{width:24px;color:var(--tenue);font:700 15px var(--f-tit)}
.cal-r .dove{font:700 11px/20px var(--f);width:20px;height:20px;text-align:center;border-radius:5px;background:var(--pan3);color:var(--tenue)}

.scelte{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:6px}
.motm{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--oroT);border:1px solid rgba(212,175,55,.3);color:var(--oro2);border-radius:12px;padding:9px;margin:8px 0}

.ms-r{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:8px}.ms-r>b{font:700 17px var(--f-tit);text-align:center}

.fine-st .dati-g{width:100%;grid-template-columns:repeat(3,1fr)}
.ob-fine{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left}

/* avviso */
.avviso{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:80;background:#f4f6f8;color:#0b0d10;padding:11px 18px;border-radius:12px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.55);transition:all .3s;max-width:calc(100% - 32px);text-align:center}
.avviso.su{opacity:1;transform:translate(-50%,0)}
.coriandoli{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}

/* partita */
.match{position:fixed;inset:0;z-index:60;background:radial-gradient(100% 50% at 50% 0,#123826,#07090b 70%);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) var(--dx) calc(10px + env(safe-area-inset-bottom,0px)) var(--sx);gap:8px;max-width:820px;margin:0 auto}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:linear-gradient(180deg,#14181d,#0b0d10);border:1px solid var(--linea2);border-radius:16px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.sbt{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.sbt b{font:700 15px/1.05 var(--f-tit);overflow-wrap:anywhere;letter-spacing:.02em}
.score{text-align:center}
.score>div{font:800 42px/1 var(--f-tit);display:flex;gap:6px;align-items:center;justify-content:center;min-width:110px;font-variant-numeric:tabular-nums}
.score i{font-style:normal;color:var(--tenue2);font-size:30px}
.score small{display:inline-block;margin-top:4px;background:var(--verde);color:#04170b;font:700 14px var(--f-tit);padding:1px 10px;border-radius:6px;letter-spacing:.04em}
.campo-wrap{position:relative;flex:0 0 auto;aspect-ratio:16/10;max-height:42vh;border-radius:12px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.6)}
.campo-wrap canvas{width:100%;height:100%;display:block}
.golbig{position:absolute;inset:0;display:grid;place-items:center;font:800 min(24vw,140px) var(--f-tit);color:#fff;-webkit-text-stroke:3px var(--c,#000);text-shadow:0 0 30px var(--c,#000),0 8px 0 rgba(0,0,0,.4);opacity:0;pointer-events:none;letter-spacing:.04em}
.golbig.via{animation:gol 1.9s ease-out}
@keyframes gol{0%{opacity:0;transform:scale(.3) rotate(-8deg)}15%{opacity:1;transform:scale(1.15) rotate(2deg)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
.m-banner{display:none}
.spett{text-align:center;font-size:12.5px;color:var(--tenue)}.spett .ic{width:15px;height:15px}
.m-tabs{display:flex;gap:4px;background:var(--pan);border:1px solid var(--linea);border-radius:10px;padding:3px}
.m-tabs button{flex:1;padding:7px;border-radius:8px;font-weight:600;font-size:13px;color:var(--tenue)}.m-tabs button.on{background:var(--pan3);color:var(--testo)}
.m-pan{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.cronaca{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px}
.cr{display:flex;gap:9px;align-items:center;background:rgba(255,255,255,.035);border-radius:10px;padding:7px 10px;font-size:14px;animation:entra .35s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(-8px)}}
.cr>span{font:700 15px var(--f-tit);color:var(--tenue);min-width:30px}
.cr p{margin:0}
.ci{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--pan3);color:var(--tenue)}.ci .ic{width:15px;height:15px}
.ci.gol{background:var(--verde);color:#04170b}.ci.giallo{background:var(--giallo);color:#241a02}.ci.rosso{background:var(--rosso);color:#fff}.ci.cambio{background:var(--bluT);color:var(--blu)}.ci.infortunio{background:var(--rossoT);color:var(--rosso)}.ci.parata{color:var(--oro)}
.cr.gol{background:linear-gradient(90deg,var(--rossoT),rgba(239,68,68,.03));font-weight:600}
.cr.gol.mio{background:linear-gradient(90deg,rgba(34,197,94,.22),rgba(34,197,94,.03))}
.cr.fine,.cr.inizio,.cr.int{background:var(--bluT)}
.m-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mf-c h4{margin:4px 0 6px;color:var(--testo)}.mf-c h4 small{color:var(--tenue)}
.mf-r{display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 0;border-top:1px solid var(--linea)}.mf-r>span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mf-r.esp{opacity:.4;text-decoration:line-through}
.mf-r .num{width:24px;height:24px;font-size:13px;border-radius:6px}
.cart{width:9px;height:12px;border-radius:2px;flex:none}.cart.g{background:var(--giallo)}.cart.r{background:var(--rosso)}
.en{display:block;width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;flex:none}.en i{display:block;height:100%;background:var(--verde)}.en.basso i{background:var(--rosso)}
.viste{display:flex;gap:6px}.viste button{flex:1;padding:7px 4px;border-radius:9px;background:var(--pan2);font-weight:600;font-size:12.5px;color:var(--tenue)}.viste button.on{background:#f4f6f8;color:#0b0d10}
.mctrl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mctrl>span{color:var(--tenue);font-size:12.5px;margin-right:2px}
.mctrl [data-vel]{padding:8px 12px;border-radius:9px;background:var(--pan2);font-weight:700}
.mctrl [data-vel].on{background:var(--verde);color:#04170b}
.pausa{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:10px;background:var(--oroT);color:var(--oro2);border:1px solid rgba(212,175,55,.3);font-weight:700;font-size:13.5px}
.salta{margin-left:auto;display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;background:var(--pan3);font-weight:700;font-size:13.5px}
.salta .ic,.pausa .ic{width:16px;height:16px}
.m-cambi{position:absolute;inset:0;z-index:5;background:rgba(5,7,9,.82);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.mc-in{width:100%;max-height:88%;overflow:auto;background:linear-gradient(180deg,#171c22,#101318);border:1px solid var(--linea2);border-radius:20px 20px 0 0;padding:16px var(--dx) calc(16px + env(safe-area-inset-bottom,0px)) var(--sx)}
@media (min-width:700px){.m-cambi{align-items:center}.mc-in{border-radius:20px;max-width:720px}}
.mc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mc-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.mc-col{grid-template-columns:1fr}}
.mc-g{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 8px;border-radius:10px;border:1px solid transparent;margin-bottom:3px;background:var(--bg2)}
.mc-g.on{border-color:var(--oro);background:var(--oroT)}
.mc-g.esp{opacity:.4}
.mc-g:disabled{opacity:.45}
.mc-g .num{width:26px;height:26px;font-size:13px;border-radius:7px}
.mc-n{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13.5px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.mc-n small{color:var(--tenue);font-weight:500;font-size:11.5px}
.mc-g .val{font-size:14px;line-height:26px;height:26px;min-width:30px}
.mc-in .btn.largo{margin-top:14px}

/* intro e fondazione */
.intro{min-height:100vh;position:relative;display:grid;place-items:center;overflow:hidden;padding:30px 20px}
.intro-luci{position:absolute;inset:-20%;background:radial-gradient(28% 24% at 15% 8%,rgba(255,250,230,.28),transparent 70%),radial-gradient(28% 24% at 85% 8%,rgba(255,250,230,.28),transparent 70%),repeating-linear-gradient(90deg,var(--campo) 0 70px,#11432f 70px 140px);animation:luci 7s ease-in-out infinite alternate}
.intro-luci::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,13,16,.4),rgba(11,13,16,.95) 68%)}
@keyframes luci{to{transform:scale(1.06) translateY(-10px)}}
.intro-c{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:420px;width:100%}
.intro-logo{animation:entraLogo 1s cubic-bezier(.2,.9,.3,1.3) both;filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))}
@keyframes entraLogo{from{opacity:0;transform:scale(.4) rotate(-20deg)}}
.intro h1{font-size:60px;line-height:.9;margin:6px 0 0;letter-spacing:.03em;background:linear-gradient(180deg,#fff 35%,var(--oro2));-webkit-background-clip:text;background-clip:text;color:transparent}
.intro h1 span{display:block;font-size:24px;letter-spacing:.6em;-webkit-text-fill-color:var(--verde);margin-top:6px;padding-left:.6em}
.intro p{color:#c9d6cf;font-size:16px;margin-bottom:6px}
.intro .nota{margin:-2px 0 6px;font-size:12.5px}
.fonda{padding:calc(20px + env(safe-area-inset-top,0px)) var(--dx) 40px var(--sx);display:flex;flex-direction:column;gap:14px;max-width:620px;margin:0 auto}
.fonda-testa{display:flex;flex-direction:column;align-items:center;gap:6px}
.fonda h1{font-size:34px;text-align:center;margin:0}
.f-sez{background:linear-gradient(180deg,var(--pan2),var(--pan));border:1px solid var(--linea);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.f-sez h3{display:flex;align-items:center;gap:8px;margin:0 0 4px}
.anteprima{display:flex;align-items:center;gap:16px;padding:16px;border-radius:18px;background:radial-gradient(circle at 20% 30%,var(--oroT),transparent 70%),var(--pan2);border:1px solid var(--linea)}
.anteprima>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.anteprima b{font:700 26px/1.05 var(--f-tit);overflow-wrap:anywhere}.anteprima small{color:var(--tenue)}
.kit-ant{display:flex;gap:6px;margin-top:6px}
.fonda label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:12.5px;color:var(--tenue);margin-top:6px}
.colori{display:flex;flex-wrap:wrap;gap:7px}
.col{width:32px;height:32px;border-radius:50%;background:var(--c);border:2px solid rgba(255,255,255,.2)}
.col.on{outline:3px solid var(--verde);outline-offset:2px}
.colori.pic{gap:5px;margin-top:6px}.colori.pic .col{width:24px;height:24px}
.diff{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}.diff button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;background:var(--bg2);border:2px solid transparent;font-size:12px;font-weight:600;text-align:center}.diff button b{font-size:22px}.diff button.on{border-color:var(--verde);background:var(--verdeT)}
.opz{display:flex;flex-wrap:wrap;gap:8px}
.opz button{padding:6px;border-radius:12px;background:var(--bg2);border:2px solid transparent}
.opz button.on{border-color:var(--verde);background:var(--verdeT)}
.kit-ed{display:flex;gap:14px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--linea)}
.kit-ed:first-of-type{border-top:0}
.kit-big{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}.kit-big small{color:var(--tenue);font-size:12px}
.kit-ed>div:last-child{flex:1;min-width:0}

.scala-liv{display:flex;align-items:center;gap:0;margin:8px 0;overflow-x:auto;padding-bottom:2px}
.scala-liv i{flex:0 0 6px;height:3px;background:var(--linea);border-radius:2px}

.liv-box{margin:12px 0;padding:12px;border-radius:14px;background:linear-gradient(135deg,rgba(212,175,55,.08),transparent 60%),var(--bg2);border:1px solid rgba(212,175,55,.2)}
.liv-box small{color:var(--oro);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.liv-tag{margin:4px 0 0;font-size:13px;color:var(--tenue)}.liv-tag b{color:var(--oro)}
.coppa-r{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:linear-gradient(90deg,color-mix(in srgb,var(--cc) 18%,transparent),transparent 70%),var(--bg2);margin-bottom:8px;border-left:3px solid var(--cc)}
.coppa-r>div:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column}.coppa-r small{color:var(--tenue);font-size:12px}
.cr-turni{display:flex;gap:4px}.cr-turni i{width:9px;height:9px;border-radius:50%;background:var(--linea)}.cr-turni i.ok{background:var(--verde)}.cr-turni i.ora{background:var(--oro);box-shadow:0 0 0 3px rgba(212,175,55,.25);animation:pulsa 1.4s infinite}
@keyframes pulsa{50%{transform:scale(1.35)}}
.coppa-svg{flex:none;filter:drop-shadow(0 4px 10px rgba(212,175,55,.35))}
.coppa-f{display:flex;flex-direction:column;gap:10px}
.cf-testa{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--cc) 35%,transparent),transparent 75%),var(--bg2)}
.cf-testa small{color:var(--tenue);text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:700}.cf-testa b{display:block;font:700 22px var(--f-tit)}
.coppa-f.festa h2{color:var(--oro);font-size:30px}.coppa-f.triste h2{color:#93a3c2}
.coppa-f .coppa-svg{animation:salto 1.4s ease-in-out infinite alternate}
.livello-f{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.livello-f .lf-ico{font-size:76px;line-height:1;filter:drop-shadow(0 10px 30px rgba(212,175,55,.5));animation:salto 1.4s ease-in-out infinite alternate}
.livello-f h1{font-size:44px;margin:0;background:linear-gradient(180deg,#fff,var(--oro));-webkit-background-clip:text;background-clip:text;color:transparent}
.livello-f .scala-liv{width:100%}
p.oro{color:var(--oro)}

/* carriere */
.car-lista,.off-lista,.focus-lista{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.car-r{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--bg2);border:1px solid var(--linea)}
.car-r.on{border-color:var(--oro);background:linear-gradient(90deg,rgba(212,175,55,.12),transparent 70%),var(--bg2)}
.car-r>div{flex:1;min-width:0;display:flex;flex-direction:column}.car-r small{color:var(--tenue);font-size:12px}
.car-ico,.car-add>.ic{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--verdeT);color:var(--verde)}
.car-ico .ic{width:22px;height:22px}
.car-add{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--bg2);border:1px solid var(--linea);text-align:left;color:inherit;font:inherit;cursor:pointer;transition:transform .15s,border-color .15s}
.car-add:hover,.car-add:active{border-color:var(--verde);transform:translateY(-1px)}
.car-add>.ic{padding:10px;box-sizing:border-box}
.car-add span{display:flex;flex-direction:column;gap:2px}.car-add small{color:var(--tenue);font-size:12.5px;line-height:1.35}
.car-add.grande{padding:16px}.car-add.grande b{font:700 22px var(--f-tit)}
.off-club{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--bg2);border:2px solid transparent;text-align:left;color:inherit;font:inherit;cursor:pointer}
.off-club span{flex:1;display:flex;flex-direction:column}.off-club small{color:var(--tenue);font-size:12px}
.off-club>i{opacity:0;color:var(--verde)}.off-club.on{border-color:var(--verde);background:var(--verdeT)}.off-club.on>i{opacity:1}
.io-card{background:radial-gradient(circle at 0 0,rgba(34,197,94,.16),transparent 55%),radial-gradient(circle at 100% 0,rgba(212,175,55,.14),transparent 50%),var(--pan)}
.io-top{display:flex;align-items:center;gap:12px}.io-top>div{flex:1;min-width:0}.io-top h2{margin:2px 0;font:700 26px var(--f-tit)}.io-top small{color:var(--tenue)}
.io-top .val{font-size:24px;padding:8px 12px}
.io-pot{display:flex;flex-direction:column;gap:4px;margin:10px 0}.io-pot small{color:var(--tenue);font-size:12px}
.io-card .seg{margin-top:10px}
.focus-r{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--bg2);border:2px solid transparent;text-align:left;color:inherit;font:inherit;cursor:pointer}
.focus-r .ic{width:26px;height:26px;color:var(--verde)}.focus-r span{display:flex;flex-direction:column}.focus-r small{color:var(--tenue)}
.focus-r.on{border-color:var(--verde);background:var(--verdeT)}
.aum-box{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.aum-box>div{background:var(--card2,rgba(255,255,255,.05));border-radius:12px;padding:10px 6px;text-align:center}.aum-box span{display:block;font-size:12px;opacity:.7}.aum-box b{display:block;font-size:18px;margin-top:4px}.aum-box b{white-space:nowrap}.aum-box b.aum-verde{color:#22c55e}.aum-sl input{width:100%;accent-color:#d4af37;height:28px}.aum-pct{text-align:center;font-size:22px;margin:4px 0}.aum-veloci{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.aum-veloci .btn{padding:8px 0;min-height:0}.aum-ch{text-align:center;margin:10px 0 4px}.aum-ch .verde{color:#22c55e}.aum-ch .oro{color:#d4af37}.aum-ch .arancio{color:#f97316}.aum-ch .rosso{color:#ef4444}
.azione{position:fixed;inset:0;z-index:90;background:#05080c;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px));gap:8px;touch-action:none;user-select:none;-webkit-user-select:none;max-width:980px;margin:0 auto}
.az-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.az-tit b{display:block;font:800 22px var(--f-tit);color:#22d3ee;letter-spacing:.03em;text-transform:uppercase}.az-tit small{opacity:.75;font-size:13px}
.az-salta{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700}
.az-wrap{position:relative;flex:0 1 auto;aspect-ratio:1/1.12;max-height:calc(100% - 270px);width:100%;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.08)}.az-wrap canvas{width:100%;height:100%;display:block}
.az-msg{position:absolute;inset:0;display:grid;place-items:center;font:800 min(15vw,84px) var(--f-tit);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.45),0 0 24px rgba(0,0,0,.6);pointer-events:none;opacity:0;text-align:center;padding:0 10px}.az-msg.via{animation:azm 1.6s ease-out forwards}.az-msg.buono{color:#4ade80}.az-msg.male{color:#fca5a5}
@keyframes azm{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.08)}30%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
.az-tempo{position:absolute;left:10px;right:10px;top:8px;height:5px;border-radius:5px;background:rgba(0,0,0,.4)}.az-tempo i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#22d3ee,#22c55e)}
.az-aiuto{position:absolute;left:8px;right:8px;bottom:6px;margin:0;font-size:12px;text-align:center;color:#fff;background:rgba(0,0,0,.45);border-radius:8px;padding:4px 6px;pointer-events:none}
.az-ctrl{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;min-height:200px}
.az-joy{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.1),rgba(255,255,255,.03));border:2px solid rgba(255,255,255,.18);display:grid;place-items:center;touch-action:none;flex:none}
.az-pom{width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cbd5e1);box-shadow:0 6px 16px rgba(0,0,0,.5);pointer-events:none;transition:transform .05s}
.az-btns{display:grid;grid-template-columns:repeat(2,minmax(78px,96px));gap:10px}
.az-b{aspect-ratio:1;border-radius:50%;border:3px solid;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.14),rgba(0,0,0,.35));color:#fff;font:800 15px var(--f-tit);letter-spacing:.02em;touch-action:none;box-shadow:0 0 18px rgba(0,0,0,.4)}
.az-b.giu{transform:scale(.92);filter:brightness(1.4)}.az-b.tiro{border-color:#f97316}.az-b.pass{border-color:#38bdf8}.az-b.filt{border-color:#facc15}.az-b.scatto{border-color:#22c55e}
.az-ctrl.por .az-btns{grid-template-columns:repeat(2,minmax(84px,104px))}
@media (orientation:landscape) and (max-height:560px){.az-wrap{position:absolute;inset:0;max-height:none;aspect-ratio:auto;border-radius:0}.az-top{position:relative;z-index:2}.az-ctrl{position:absolute;left:12px;right:12px;bottom:12px;min-height:0;z-index:2}.az-joy{width:130px;height:130px}.az-b{opacity:.92}.az-aiuto{display:none}}
.campo-g .az-wrap{aspect-ratio:1/1.25;max-height:calc(100% - 240px)}
.cg-sb{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;min-width:0}.cg-sq{font:700 13px var(--f-tit);text-transform:uppercase;max-width:22vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:4px solid var(--c);padding-left:6px}.cg-ris{white-space:nowrap;font:800 22px var(--f-tit);background:#0f172a;border-radius:8px;padding:2px 10px}.cg-min{background:#16a34a;color:#fff;font:800 14px var(--f-tit);border-radius:6px;padding:3px 8px}
.cg-fine{position:absolute;inset:0;background:rgba(3,6,10,.88);display:grid;place-items:center;z-index:5;padding:20px}.cg-fine-in{background:#111827;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:22px;width:min(420px,100%);text-align:center}.cg-fris{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0}.cg-fris b{font:800 40px var(--f-tit)}.cg-fris span{font-weight:700;max-width:35%}.cg-io{display:flex;justify-content:center;gap:10px;margin:10px 0 16px}.cg-io div{background:rgba(255,255,255,.06);border-radius:12px;padding:8px 16px}.cg-io small{display:block;opacity:.7}.cg-io b{font:800 26px var(--f-tit);color:#22d3ee}
.az-lista{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.az-lista .btn{flex:1 1 150px}
</style>
