<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07130e">
<meta name="description" content="Presidente PM: fonda la tua società di calcio e portala dalla Terza Categoria alla Serie A. Giocatori, staff, stadio e gironi online.">
<title>Presidente PM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra in alto (stemma, soldi, menu) · schermata che scorre · barra in basso con 5 sezioni.
   La partita, i fogli e la fondazione si aprono sopra a tutto. */
:root{
  --fondo:#07130e;--fondo2:#0c1f17;--carta:#0f241b;--carta2:#143024;--linea:rgba(255,255,255,.09);
  --testo:#eef6f0;--tenue:#8fa89a;--verde:#3ddc84;--oro:#f5c542;--oro2:#ffdf7e;--rosso:#ff6b6b;--giallo:#ffd43b;--blu:#4dabf7;--lime:#c6ff3d;
  --f-tit:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--f:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sx:max(14px,env(safe-area-inset-left,0px));--dx:max(14px,env(safe-area-inset-right,0px));
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--fondo) radial-gradient(120% 60% at 50% -10%,#16422f 0%,var(--fondo) 60%) fixed;color:var(--testo);font:16px/1.45 var(--f);min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit}
h1,h2,h3{font-family:var(--f-tit);letter-spacing:.01em;margin:0 0 .4em;line-height:1.1}
h2{font-size:26px}h3{font-size:19px;font-weight:700}
p{margin:.3em 0}
.tenue{color:var(--tenue)}.verde{color:var(--verde)}.rosso{color:var(--rosso)}.giallo{color:var(--giallo)}.centro{text-align:center}
.nota{color:var(--tenue);font-size:13.5px;margin:.5em 0}
a{color:var(--oro)}
#app{max-width:720px;margin:0 auto;min-height:100vh}

/* barra in alto */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) var(--dx) 8px var(--sx);background:rgba(7,19,14,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
.club{display:flex;align-items:center;gap:9px;min-width:0;flex:1;text-align:left}
.club b{display:block;font:700 19px/1.05 var(--f-tit);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.club small{display:block;font-size:12px;color:var(--tenue);white-space:nowrap}
.club small::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:5px;vertical-align:0}
.club>span{min-width:0}
.online-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--verde);box-shadow:0 0 8px var(--verde);vertical-align:1px}
.soldi{font:800 18px var(--f-tit);color:var(--oro);background:rgba(245,197,66,.1);border:1px solid rgba(245,197,66,.3);padding:4px 11px;border-radius:999px;white-space:nowrap}
.soldi.rosso{color:var(--rosso);border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.1)}
.menu-btn{width:40px;height:40px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:rgba(255,255,255,.05)}
.menu-btn span{display:block;width:18px;height:2px;border-radius:2px;background:var(--testo)}

.schermo{padding:14px var(--dx) calc(96px + env(safe-area-inset-bottom,0px)) var(--sx);display:flex;flex-direction:column;gap:14px}

/* barra in basso */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:rgba(7,19,14,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--linea);padding:6px var(--dx) calc(6px + env(safe-area-inset-bottom,0px)) var(--sx)}
.barra button{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--tenue);font-size:11.5px;font-weight:600;position:relative;border-radius:12px}
.barra svg{width:24px;height:24px;fill:currentColor}
.barra button.on{color:var(--lime)}
.barra button.on::before{content:'';position:absolute;top:-7px;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--lime);box-shadow:0 0 12px var(--lime)}
.pallino{position:absolute;top:4px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--oro)}

/* carte */
.carta{background:linear-gradient(180deg,var(--carta2),var(--carta));border:1px solid var(--linea);border-radius:20px;padding:16px;box-shadow:0 10px 30px -18px rgba(0,0,0,.8)}
.carta-tit{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.carta-tit h3{margin:0}
.carta.vuoto{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.link{color:var(--oro);font-weight:600;font-size:14px}
.link.rosso{color:var(--rosso)}

/* bottoni */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:14px;font-weight:700;background:var(--verde);color:#052e16;box-shadow:0 6px 18px -8px var(--verde);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.oro{background:linear-gradient(180deg,var(--oro2),var(--oro));color:#3b2a00;box-shadow:0 8px 24px -10px var(--oro)}
.btn.sec{background:rgba(255,255,255,.08);color:var(--testo);box-shadow:none;border:1px solid var(--linea)}
.btn.rosso{background:var(--rosso);color:#3a0000;box-shadow:none}
.btn.mini{min-height:36px;padding:6px 12px;font-size:14px;border-radius:11px;white-space:nowrap}
.btn.largo{width:100%}
.btn:disabled{opacity:.38;box-shadow:none}
.riga-btn{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.riga-btn .btn{flex:1}

/* prossima partita */
.hero-match{position:relative;border-radius:24px;padding:16px;overflow:hidden;border:1px solid rgba(198,255,61,.18);
  background:radial-gradient(90% 70% at 50% 0%,rgba(198,255,61,.16),transparent 70%),repeating-linear-gradient(90deg,#14532d 0 34px,#166534 34px 68px);box-shadow:0 20px 40px -22px #000, inset 0 0 80px rgba(0,0,0,.45)}
.hero-match::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,19,14,.25),rgba(7,19,14,.75));pointer-events:none}
.hero-match>*{position:relative}
.hm-top{display:flex;justify-content:space-between;font-size:12.5px;color:#d3f9d8;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.hm-squadre{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin:14px 0 16px}
.hm-t{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0}
.hm-t .stemma{filter:drop-shadow(0 8px 12px rgba(0,0,0,.55))}
.hm-t b{font:800 20px/1.05 var(--f-tit);max-width:100%;overflow-wrap:anywhere}
.hm-t small{color:#c3e6cb;font-size:12.5px}
.hm-vs{text-align:center}
.hm-vs b{display:block;font:800 30px var(--f-tit);color:var(--lime);text-shadow:0 0 18px rgba(198,255,61,.6)}
.hm-vs small{font-size:12px;color:#d3f9d8;white-space:nowrap}
.btn-gioca{width:100%;min-height:60px;border-radius:18px;font:800 22px var(--f-tit);letter-spacing:.06em;color:#0b2a05;background:linear-gradient(180deg,#e2ff8a,var(--lime));box-shadow:0 0 0 0 rgba(198,255,61,.6),0 12px 28px -10px var(--lime);animation:pulsa 2.2s infinite;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-gioca span{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#0b2a05;color:var(--lime);font-size:15px}
.btn-gioca.occupato{opacity:.6;animation:none}
@keyframes pulsa{0%{box-shadow:0 0 0 0 rgba(198,255,61,.55),0 12px 28px -10px var(--lime)}70%{box-shadow:0 0 0 14px rgba(198,255,61,0),0 12px 28px -10px var(--lime)}100%{box-shadow:0 0 0 0 rgba(198,255,61,0),0 12px 28px -10px var(--lime)}}
.problemi{display:flex;flex-direction:column;gap:8px}
.problema{display:flex;justify-content:space-between;align-items:center;text-align:left;background:rgba(0,0,0,.45);border:1px solid rgba(255,212,59,.35);color:#fff3bf;padding:12px 14px;border-radius:14px;font-weight:600}
.problema span{font-size:22px;color:var(--giallo)}
.attesa{background:rgba(0,0,0,.45);border-radius:16px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--lime);animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.hero-match .nota{color:#c3e6cb;text-align:center}

/* per iniziare */
.todo{display:flex;flex-direction:column;gap:6px}
.todo-r{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 4px;border-bottom:1px solid var(--linea);font-weight:600}
.todo-r i{width:24px;height:24px;border-radius:50%;border:2px solid var(--tenue);display:grid;place-items:center;font-style:normal;font-size:13px;flex:none}
.todo-r.ok{color:var(--tenue);text-decoration:line-through}
.todo-r.ok i{background:var(--verde);border-color:var(--verde);color:#052e16}
.todo .btn{margin-top:8px}

/* tessere */
.tessere{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:520px){.tessere{grid-template-columns:repeat(2,1fr)}}
.tessera{background:linear-gradient(180deg,var(--carta2),var(--carta));border:1px solid var(--linea);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.tessera span{font-weight:700;font-size:13.5px}
.tessera small{color:var(--tenue);font-size:11.5px}
.anello{--p:.5;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--lime) calc(var(--p)*360deg),rgba(255,255,255,.08) 0);margin-bottom:4px;position:relative}
.anello::before{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--carta)}
.anello.morale{background:conic-gradient(var(--oro) calc(var(--p)*360deg),rgba(255,255,255,.08) 0)}
.anello b{position:relative;font:800 24px var(--f-tit)}
.numero{font:800 34px/62px var(--f-tit);height:66px;color:var(--testo)}

/* classifica */
.tab{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.tab th{font:700 12px var(--f);color:var(--tenue);text-transform:uppercase;letter-spacing:.04em;padding:6px 4px;text-align:center}
.tab td{padding:6px 4px;text-align:center;border-top:1px solid var(--linea)}
.tab .sx{text-align:left}
.tab tr.io td{background:rgba(198,255,61,.1)}
.tab tr.io td:first-child{box-shadow:inset 3px 0 var(--lime)}
.pos{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font:700 14px var(--f-tit);background:rgba(255,255,255,.06)}
tr.promo .pos{background:var(--verde);color:#052e16}
tr.retro .pos{background:var(--rosso);color:#3a0000}
.sq{display:flex;align-items:center;gap:7px;min-width:0}
.sq>span:not(.tag){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44vw;font-weight:600}
.tab.mini .sq>span:not(.tag){max-width:52vw}
.sq .stemma{flex:none}
.tag{font-size:11px;flex:none}
.tag.tu{background:var(--lime);color:#0b2a05;font-weight:800;padding:1px 6px;border-radius:6px;font-size:10.5px}
.tag.bot{opacity:.6}
.forma{display:inline-flex;gap:2px}
.forma i{font:700 10px/16px var(--f);width:16px;height:16px;border-radius:4px;font-style:normal;color:#06110c}
.forma .V{background:var(--verde)}.forma .N{background:#adb5bd}.forma .P{background:var(--rosso)}
@media (max-width:560px){.tab:not(.mini) th:nth-child(4),.tab:not(.mini) td:nth-child(4),.tab:not(.mini) th:nth-child(5),.tab:not(.mini) td:nth-child(5),.tab:not(.mini) th:nth-child(6),.tab:not(.mini) td:nth-child(6),.tab:not(.mini) th:last-child,.tab:not(.mini) td:last-child{display:none}}
.legenda{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--tenue)}
.legenda .q{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.q.promo{background:var(--verde)}.q.retro{background:var(--rosso)}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.05);border:1px solid var(--linea);padding:4px;border-radius:14px}
.tabs button{flex:1;padding:9px 6px;border-radius:10px;font-weight:700;color:var(--tenue)}
.tabs button.on{background:var(--carta2);color:var(--testo);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.cal{display:flex;flex-direction:column}
.cal-r{display:flex;align-items:center;gap:9px;padding:8px 4px;border-top:1px solid var(--linea)}
.cal-r.ora{background:rgba(198,255,61,.08);border-radius:10px}
.cal-r .g{width:24px;color:var(--tenue);font:700 15px var(--f-tit)}
.cal-r .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.es{font:800 16px var(--f-tit);padding:2px 8px;border-radius:8px}
.es.V{background:rgba(61,220,132,.2);color:var(--verde)}.es.N{background:rgba(255,255,255,.1)}.es.P{background:rgba(255,107,107,.18);color:var(--rosso)}
.es.prossima{font-size:12px;background:var(--lime);color:#0b2a05}
.scala{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:10px}
.gradino{width:var(--w);display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:10px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));font:700 16px var(--f-tit);opacity:.55}
.gradino span{display:flex;align-items:center;gap:6px}
.gradino.fatto{opacity:.8}
.gradino.qui{opacity:1;outline:2px solid var(--lime);box-shadow:0 0 20px rgba(198,255,61,.4);transform:scale(1.04)}
.storia{display:flex;flex-direction:column}
.st-r{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--linea)}
.st-r .tenue{grid-column:1/4;font-size:13px}
.pos-b{font:800 20px var(--f-tit);color:var(--oro)}
.trofei{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px}
.trofeo{background:radial-gradient(circle at 50% 20%,rgba(245,197,66,.25),transparent 70%),var(--carta);border:1px solid rgba(245,197,66,.35);border-radius:16px;padding:12px;text-align:center;display:flex;flex-direction:column}
.trofeo span{font-size:38px}.trofeo b{font:700 15px var(--f-tit)}.trofeo small{color:var(--tenue)}

/* risultati */
.risultato{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;padding:6px 0}
.risultato>div{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:14px;min-width:0}
.risultato>div span{overflow-wrap:anywhere}
.risultato>b{font:800 34px var(--f-tit);padding:2px 14px;border-radius:12px;background:rgba(255,255,255,.07)}
.risultato.V>b{color:var(--verde)}.risultato.P>b{color:var(--rosso)}
.marc{font-size:13.5px;color:var(--tenue);text-align:center}
.notizie{display:flex;flex-direction:column}
.notizia{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--linea);font-size:14.5px}
.notizia:first-child{border-top:0}
.notizia i{font-style:normal;font-size:20px;flex:none;width:28px;text-align:center}
.graf{width:100%;height:70px;display:block}
.graf-leg{display:flex;justify-content:space-between;font-size:12px;color:var(--tenue)}

/* squadra */
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--linea);background:rgba(255,255,255,.04);font-weight:700;font-size:14px;color:var(--tenue)}
.chip.on{background:var(--lime);color:#0b2a05;border-color:var(--lime)}
.forza-b{font-size:14px;color:var(--tenue)}
.forza-b b{font:800 22px var(--f-tit);color:var(--lime);margin-left:4px}
.campo-tat{position:relative;aspect-ratio:3/3.6;max-height:470px;margin:6px auto;width:100%;border-radius:16px;overflow:hidden;
  background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,.75)) 50% 50%/100% 2px no-repeat,radial-gradient(circle at 50% 50%,transparent 15%,rgba(255,255,255,.75) 15.4%,transparent 16%),repeating-linear-gradient(180deg,#2f9e44 0 9%,#37b24d 9% 18%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.7),inset 0 0 60px rgba(0,0,0,.35)}
.campo-tat::before,.campo-tat::after{content:'';position:absolute;left:28%;right:28%;height:13%;border:2px solid rgba(255,255,255,.75)}
.campo-tat::before{top:-2px}.campo-tat::after{bottom:-2px}
.pt{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;width:76px;z-index:1}
.pt small{font-size:11.5px;font-weight:700;background:rgba(0,0,0,.6);padding:0 6px;border-radius:6px;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt em{position:absolute;top:-4px;right:12px;font:800 11px/18px var(--f-tit);font-style:normal;min-width:20px;height:18px;border-radius:9px;padding:0 4px}
.pt.fuori .maglia{outline:2px dashed var(--giallo);outline-offset:2px}
.maglia{display:grid;place-items:center;width:38px;height:38px;border-radius:12px 12px 14px 14px;background:linear-gradient(90deg,var(--c1) 0 50%,color-mix(in srgb,var(--c1) 80%,#000) 50%);border:2.5px solid var(--c2);font:800 16px var(--f-tit);color:#fff;text-shadow:0 1px 2px #000;box-shadow:0 5px 10px rgba(0,0,0,.45)}
.maglia.big{width:64px;height:64px;font-size:26px;border-radius:18px}
.seg{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--linea);border-radius:14px;padding:4px;gap:4px;margin-top:8px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-weight:700;font-size:14px;color:var(--tenue)}
.seg button.on{background:var(--carta2);color:var(--testo);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.gioc{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 2px;border-top:1px solid var(--linea)}
.carta h3+.gioc{border-top:0}
.num{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font:800 16px var(--f-tit);background:#334155}
.num.rP{background:#b08900;color:#fff}.num.rD{background:#1c64b8}.num.rC{background:#2b8a3e}.num.rA{background:#c92a2a}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.info b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.info small{color:var(--tenue);font-size:12.5px}
.info small em{color:var(--lime);font-style:normal}
.barra-forma{height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:4px;max-width:140px;overflow:hidden}
.barra-forma i{display:block;height:100%;background:linear-gradient(90deg,var(--rosso),var(--giallo),var(--verde));background-size:140px 100%}
.inf{font-size:13px;color:var(--rosso);font-weight:700}
.val{flex:none;font:800 17px/34px var(--f-tit);min-width:40px;height:34px;text-align:center;border-radius:10px;padding:0 4px}
.v1,.pt em.v1{background:#495057;color:#fff}.v2,.pt em.v2{background:#e67700;color:#fff}.v3,.pt em.v3{background:#f5c542;color:#2b1d00}.v4,.pt em.v4{background:#3ddc84;color:#052e16}.v5,.pt em.v5{background:linear-gradient(135deg,#c6ff3d,#3ddc84);color:#052e16;box-shadow:0 0 12px rgba(198,255,61,.5)}
.scheda-g{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.scheda-g>div{flex:1}
.scheda-g h2{margin:0}
.dati-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.dati-g>div{background:rgba(255,255,255,.05);border-radius:14px;padding:10px;text-align:center;display:flex;flex-direction:column}
.dati-g small{color:var(--tenue);font-size:12px}
.dati-g b{font:800 22px var(--f-tit)}
.avviso-in{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.3);padding:10px;border-radius:12px}
.lista-scelta{max-height:60vh;overflow:auto}

/* mercato */
.merc-r{display:flex;align-items:center;gap:8px;border-top:1px solid var(--linea)}
.merc-r .gioc{border:0;flex:1;min-width:0}
.btn.largo+.merc{margin-top:10px}
.staff-c{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(198,255,61,.07);border:1px solid rgba(198,255,61,.2);border-radius:12px;padding:10px 12px;margin:6px 0}
.staff-c.vuoto{color:var(--tenue);background:rgba(255,255,255,.03);border-color:var(--linea)}
.staff-c small{color:var(--tenue);flex:1}
.obbl{font:700 11px var(--f);background:var(--giallo);color:#3b2a00;padding:2px 7px;border-radius:6px;vertical-align:3px}
.stelle{color:var(--oro);letter-spacing:1px;font-size:14px}
.stelle i{color:rgba(255,255,255,.15);font-style:normal}
.cand{display:flex;flex-direction:column}
.cand-r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--linea)}
.cand-r>span{display:flex;flex-direction:column;min-width:0}
.cand-r b{font-weight:600;font-size:14.5px}
.cand-r small{color:var(--tenue);font-size:12.5px}

/* stadio */
.stadio-c{padding:10px}
.stadio-wrap{position:relative;border-radius:14px;overflow:hidden;background:#1f3b2b}
.stadio-svg{display:block;width:100%;height:auto}
.stadio-nome{position:absolute;left:10px;top:8px;font:800 16px var(--f-tit);background:rgba(0,0,0,.55);padding:2px 10px;border-radius:8px;letter-spacing:.04em;text-transform:uppercase}
.stadio-dati{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stadio-dati>div{background:rgba(255,255,255,.05);border-radius:12px;padding:8px;text-align:center;display:flex;flex-direction:column}
.stadio-dati small{color:var(--tenue);font-size:12px}
.stadio-dati b{font:800 20px var(--f-tit)}
.usura{padding:4px 6px}
.usura-t{display:flex;justify-content:space-between;font-weight:600}
.usura-t b{font:800 20px var(--f-tit)}
.barra-u{height:10px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin:4px 0 10px}
.barra-u i{display:block;height:100%;border-radius:5px;background:var(--verde)}.barra-u i.giallo{background:var(--giallo)}.barra-u i.rosso{background:var(--rosso)}
.usura .btn{width:100%}
.mig-top{display:flex;align-items:center;gap:12px}
.mig-top>div{flex:1;min-width:0}
.mig-top h3{margin:0}
.mig-top p{color:var(--tenue);font-size:13.5px;margin:0}
.mig-ico{font-size:28px;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.06);flex:none}
.livelli{display:flex;gap:3px;flex-wrap:wrap;max-width:90px;justify-content:flex-end}
.livelli i{width:9px;height:9px;border-radius:3px;background:rgba(255,255,255,.12)}
.livelli i.on{background:var(--lime);box-shadow:0 0 6px rgba(198,255,61,.6)}
.livelli i.lavori{background:var(--oro);animation:lamp 1s infinite alternate}
@keyframes lamp{to{opacity:.3}}
.mig-btn{width:100%;justify-content:space-between;text-align:left;font-size:14.5px}
.mig-btn b{white-space:nowrap}
.lavori-b{background:rgba(245,197,66,.1);border:1px dashed rgba(245,197,66,.5);color:var(--oro2);padding:10px 12px;border-radius:12px;font-weight:600;font-size:14px}
.lavori-b.max{border-style:solid;text-align:center}

/* fogli */
.velo{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.velo.su{opacity:1}
.foglio{position:relative;width:100%;max-width:640px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#163527,#0c1f17 40%);border:1px solid var(--linea);border-bottom:0;border-radius:26px 26px 0 0;padding:22px var(--dx) calc(22px + env(safe-area-inset-bottom,0px)) var(--sx);transform:translateY(30px);transition:transform .25s cubic-bezier(.2,.9,.3,1.2)}
.velo.su .foglio{transform:none}
.foglio .x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);font-size:16px;z-index:2}
.foglio h3{margin-top:16px}
.stat-p{background:rgba(255,255,255,.05);border-radius:14px;padding:10px 14px;margin:10px 0}
.stat-p>div{display:flex;justify-content:space-between;align-items:center;font:800 18px var(--f-tit)}
.stat-p small{font:600 12.5px var(--f);color:var(--tenue)}
.barra2{height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden;margin:4px 0 8px}
.barra2 i{display:block;height:100%}
.bil>div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--linea);font-size:14.5px}
.bil .tot{font-weight:800;font-size:16px}
.altri>div{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--linea);font-size:13.5px;align-items:center}
.altri>div span:first-child{text-align:right}
.altri>div.io{color:var(--lime);font-weight:700}
.altri b{font-family:var(--f-tit);font-size:17px}
.fine-st{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.fine-st .coppa{font-size:84px;line-height:1;filter:drop-shadow(0 10px 30px rgba(245,197,66,.6));animation:salto 1.4s ease-in-out infinite alternate}
@keyframes salto{to{transform:translateY(-8px) scale(1.05)}}
.fine-st h1{font-size:46px;margin:6px 0 0;background:linear-gradient(180deg,#fff,var(--oro));-webkit-background-clip:text;background-clip:text;color:transparent}
.fine-st.triste h1{background:linear-gradient(180deg,#fff,#91a7ff);-webkit-background-clip:text;background-clip:text}
.fine-st .dati-g{width:100%}
.menu-top{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.menu-top h2{margin:0}
.menu-sez{border-top:1px solid var(--linea);padding:12px 0;display:flex;flex-direction:column}
.online-sez{background:radial-gradient(circle at 100% 0,rgba(77,171,247,.15),transparent 60%);border-radius:16px;padding:14px;border:1px solid rgba(77,171,247,.25);margin-bottom:10px}
.riga-menu{text-align:left;padding:13px 4px;font-weight:600;border-top:1px solid var(--linea)}
.riga-menu:first-child{border-top:0}
.riga-menu.rosso{color:var(--rosso)}
.guida p{margin:.6em 0}
.login-f{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.login-f input,.fonda input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--linea);background:rgba(0,0,0,.35);color:var(--testo);font-size:16px}

/* avviso */
.avviso{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:80;background:#f8f9fa;color:#111;padding:11px 18px;border-radius:14px;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.5);transition:all .3s;max-width:calc(100% - 32px);text-align:center}
.avviso.su{opacity:1;transform:translate(-50%,0)}
.coriandoli{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}

/* partita */
.match{position:fixed;inset:0;z-index:60;background:radial-gradient(100% 50% at 50% 0,#1b4d36,#050d09 70%);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) var(--dx) calc(10px + env(safe-area-inset-bottom,0px)) var(--sx);gap:10px;max-width:720px;margin:0 auto}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:linear-gradient(180deg,#0f172a,#020617);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.sbt{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.sbt b{font:700 15px/1.05 var(--f-tit);overflow-wrap:anywhere}
.score{text-align:center}
.score>div{font:800 44px/1 var(--f-tit);display:flex;gap:6px;align-items:center;justify-content:center;min-width:110px}
.score i{font-style:normal;color:var(--tenue);font-size:30px}
.score small{display:inline-block;margin-top:4px;background:var(--lime);color:#0b2a05;font:800 14px var(--f-tit);padding:1px 10px;border-radius:6px}
.campo-wrap{position:relative;flex:0 0 auto;aspect-ratio:16/10;max-height:44vh;border-radius:14px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.6)}
.campo-wrap canvas{width:100%;height:100%;display:block}
.golbig{position:absolute;inset:0;display:grid;place-items:center;font:800 min(26vw,150px) var(--f-tit);color:#fff;-webkit-text-stroke:4px var(--c,#000);text-shadow:0 0 30px var(--c,#000),0 8px 0 rgba(0,0,0,.4);opacity:0;pointer-events:none;letter-spacing:.04em}
.golbig.via{animation:gol 1.9s ease-out}
@keyframes gol{0%{opacity:0;transform:scale(.3) rotate(-8deg)}15%{opacity:1;transform:scale(1.15) rotate(2deg)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
.spett{text-align:center;font-size:13px;color:var(--tenue)}
.cronaca{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px;mask-image:linear-gradient(180deg,#000 75%,transparent)}
.cr{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.04);border-radius:12px;padding:8px 10px;font-size:14.5px;animation:entra .35s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(-8px)}}
.cr span{font:800 15px var(--f-tit);color:var(--tenue);min-width:30px}
.cr p{margin:0}
.cr.gol{background:linear-gradient(90deg,rgba(255,107,107,.25),rgba(255,107,107,.05));font-weight:700}
.cr.gol.mio{background:linear-gradient(90deg,rgba(198,255,61,.3),rgba(198,255,61,.05))}
.cr.fine,.cr.inizio,.cr.int{background:rgba(77,171,247,.12)}
.mctrl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mctrl>span{color:var(--tenue);font-size:13px;margin-right:2px}
.mctrl [data-vel]{padding:8px 13px;border-radius:10px;background:rgba(255,255,255,.07);font-weight:800}
.mctrl [data-vel].on{background:var(--lime);color:#0b2a05}
.salta{margin-left:auto;padding:9px 15px;border-radius:12px;background:rgba(255,255,255,.12);font-weight:700}

/* intro e fondazione */
.intro{min-height:100vh;position:relative;display:grid;place-items:center;overflow:hidden;padding:30px 20px}
.intro-luci{position:absolute;inset:-20%;background:radial-gradient(30% 25% at 15% 10%,rgba(255,249,219,.35),transparent 70%),radial-gradient(30% 25% at 85% 10%,rgba(255,249,219,.35),transparent 70%),repeating-linear-gradient(90deg,#14532d 0 60px,#166534 60px 120px);animation:luci 6s ease-in-out infinite alternate}
.intro-luci::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,13,9,.35),rgba(5,13,9,.92) 70%)}
@keyframes luci{to{transform:scale(1.06) translateY(-10px)}}
.intro-c{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:420px;width:100%}
.intro-logo{animation:entraLogo 1s cubic-bezier(.2,.9,.3,1.3) both;filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))}
@keyframes entraLogo{from{opacity:0;transform:scale(.4) rotate(-20deg)}}
.intro h1{font-size:62px;line-height:.9;margin:4px 0 0;letter-spacing:.02em;background:linear-gradient(180deg,#fff 30%,var(--oro));-webkit-background-clip:text;background-clip:text;color:transparent}
.intro h1 span{display:block;font-size:26px;letter-spacing:.5em;-webkit-text-fill-color:var(--lime);margin-top:4px;padding-left:.5em}
.intro p{color:#d3f9d8;font-size:17px;margin-bottom:10px}
.fonda{padding:calc(20px + env(safe-area-inset-top,0px)) var(--dx) 40px var(--sx);display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
.fonda h1{font-size:34px;text-align:center}
.anteprima{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px;border-radius:22px;background:radial-gradient(circle at 50% 30%,rgba(245,197,66,.18),transparent 70%),var(--carta)}
.anteprima b{font:800 24px var(--f-tit);text-align:center}
.fonda label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;color:var(--tenue)}
.scelta>span{display:block;font-weight:600;font-size:14px;color:var(--tenue);margin-bottom:6px}
.colori{display:flex;flex-wrap:wrap;gap:7px}
.col{width:34px;height:34px;border-radius:50%;background:var(--c);border:2px solid rgba(255,255,255,.25)}
.col.on{outline:3px solid var(--lime);outline-offset:2px}
.opz{display:flex;flex-wrap:wrap;gap:8px}
.opz button{padding:6px;border-radius:12px;background:rgba(255,255,255,.05);border:2px solid transparent}
.opz button.on{border-color:var(--lime);background:rgba(198,255,61,.1)}
</style>
</head>
